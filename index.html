main{margin-left:250px;min-height:100vh}.topbar{height:78px;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:30}.heading{display:flex;gap:11px;align-items:center}.hamb{display:none;border:0;background:none;font-size:23px}.heading h1{font-size:21px;margin:0}.heading p{margin:3px 0 0;font-size:12px;color:var(--muted)}.topActions{display:flex;align-items:center;gap:8px}.userPill{font-size:11px;color:var(--muted);max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.content{padding:24px 28px 100px;animation:pageIn .16s ease-out}.content.leaving{animation:pageOut .08s ease-in}@keyframes pageIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}@keyframes pageOut{to{opacity:0;transform:translateY(-3px)}}
.primary{border:0;background:var(--pink);color:#fff;padding:11px 15px;border-radius:11px;font-weight:750;box-shadow:0 5px 16px rgba(165,29,85,.16)}.softBtn{border:0;background:var(--soft);color:var(--pink);padding:9px 11px;border-radius:10px;font-weight:700}.danger{border:0;background:#fff0f3;color:var(--red);padding:9px 11px;border-radius:10px;font-weight:700}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}.card{background:#fff;border:1px solid var(--line);border-radius:17px;padding:17px;box-shadow:var(--shadow)}.eyebrow{font-size:11px;color:var(--muted)}.big{font-size:23px;font-weight:800;margin:7px 0}.green{color:var(--green)}.red{color:var(--red)}.muted{font-size:12px;color:var(--muted)}.layout{display:grid;grid-template-columns:1.35fr .65fr;gap:15px;margin-top:15px}.panel{background:#fff;border:1px solid var(--line);border-radius:17px;padding:17px;box-shadow:var(--shadow)}.panelHead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:13px}.panel h3{margin:0;font-size:16px}.chart{height:205px;display:flex;align-items:flex-end;gap:9px;padding:12px 2px 25px}.bar{flex:1;min-height:5px;background:linear-gradient(#f29cc4,var(--pink));border-radius:8px 8px 2px 2px;position:relative}.bar small{position:absolute;bottom:-21px;width:100%;text-align:center;font-size:10px;color:var(--muted)}.notice{padding:11px 12px;background:var(--soft);border-radius:11px;margin:7px 0;font-size:13px}.notice.over{background:#fff0f3;color:#9f183d}.quick{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid #f1e6eb}.quick:last-child{border-bottom:0}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.search{flex:1;min-width:180px;border:1px solid var(--line);border-radius:11px;padding:11px;background:#fff;outline:none}.tableWrap{overflow:auto}.table{width:100%;border-collapse:collapse;font-size:13px}.table th,.table td{padding:11px 8px;border-bottom:1px solid #f0e7eb;text-align:left;white-space:nowrap}.table th{font-size:10px;color:var(--muted);text-transform:uppercase}.badge{display:inline-block;padding:4px 8px;border-radius:99px;font-size:10px;font-weight:750}.bpaid{background:#e6f7ef;color:#087b58}.bpart{background:#eee7f9;color:#624099}.bpending{background:#fff3d6;color:#8e620b}.boverdue{background:#ffe7ed;color:#ae1e42}.empty{text-align:center;color:var(--muted);padding:38px 12px}
.modalBg{position:fixed;inset:0;background:rgba(39,9,24,.52);backdrop-filter:blur(3px);display:grid;place-items:center;padding:14px;z-index:100;animation:fade .12s ease-out}@keyframes fade{from{opacity:0}to{opacity:1}}.modal{width:min(720px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:20px;padding:20px;box-shadow:0 25px 70px rgba(30,0,18,.25);animation:modalIn .14s ease-out}@keyframes modalIn{from{transform:translateY(7px) scale(.99);opacity:0}to{transform:none;opacity:1}}.modalHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.modalHead h2{font-size:20px;margin:0}.close{border:0;background:var(--soft);color:var(--pink);width:35px;height:35px;border-radius:50%;font-size:20px}.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field label{display:block;font-size:11px;color:var(--muted);margin-bottom:5px}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;background:#fff;color:var(--ink);outline:none}.field textarea{min-height:78px}.full{grid-column:1/-1}.modalFoot{display:flex;justify-content:flex-end;gap:8px;margin-top:17px}
.bottom{display:none}.progressRow{display:flex;align-items:center;gap:8px;margin:12px 0}.progressRow span{width:145px;font-size:12px}.progress{flex:1;height:7px;background:#f0e3e9;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:var(--pink)}
#toast{position:fixed;right:18px;bottom:18px;z-index:200;background:#321722;color:#fff;padding:12px 15px;border-radius:11px;opacity:0;transform:translateY(8px);transition:.18s}.toastOn{opacity:1!important;transform:none!important}
@media(max-width:900px){.sidebar{transform:translateX(-100%);transition:.16s}.sidebar.open{transform:none}.hamb{display:block}main{margin-left:0}.topbar{padding:0 15px}.content{padding:16px 14px 92px}.cards{grid-template-columns:1fr 1fr}.layout{grid-template-columns:1fr}.bottom{display:grid;position:fixed;left:0;right:0;bottom:0;height:68px;background:rgba(255,255,255,.97);backdrop-filter:blur(14px);border-top:1px solid var(--line);z-index:40;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom)}.bottom button{border:0;background:none;color:var(--muted);font-size:10px}.bottom button.active{color:var(--pink);font-weight:750}.bottom b{display:block;font-size:20px;margin-bottom:2px}.userPill{display:none}}
@media(max-width:560px){.topbar{height:70px}.heading h1{font-size:18px}.heading p{display:none}.topbar>.primary{font-size:12px;padding:9px 10px}.form{grid-template-columns:1fr}.full{grid-column:auto}.toolbar{display:grid;grid-template-columns:1fr}.toolbar>*{width:100%}.big{font-size:19px}.card{padding:14px}.panel{padding:14px}}
</style>

<body>
<div id="login">
  <div class="loginCard">
    <div class="logo"><div class="mark">T</div><div><strong>Telle</strong><span>Cosméticos</span></div></div>
    <h1>Entrar no sistema</h1>
    <p>Seus dados ficam sincronizados na nuvem.</p>
    <div class="loginField"><label>E-mail</label><input id="loginEmail" type="email" autocomplete="username" placeholder="seu@email.com"></div>
    <div class="loginField"><label>Senha</label><input id="loginPass" type="password" autocomplete="current-password" placeholder="Sua senha"></div>
    <button class="loginBtn" id="loginBtn">Entrar</button>
    <div class="loginMsg" id="loginMsg"></div>
    <div class="loginFoot">Telle Cosméticos • Sistema V3</div>
  </div>
</div>

<div class="app" id="app" hidden>
<aside class="sidebar" id="sidebar">
<div class="brand"><div class="mark">T</div><div><strong>Telle</strong><span>Cosméticos</span></div></div>
<nav class="nav" id="nav">
<button data-page="dashboard" class="active"><em>⌂</em>Início</button><button data-page="vendas"><em>🛍️</em>Vendas</button><button data-page="estoque"><em>📦</em>Estoque</button><button data-page="clientes"><em>👥</em>Clientes</button><button data-page="financeiro"><em>💰</em>Financeiro</button><button data-page="cobrancas"><em>📅</em>Cobranças</button><button data-page="fornecedores"><em>🏷️</em>Fornecedores</button><button data-page="relatorios"><em>📊</em>Relatórios</button><button data-page="config" ><em>⚙️</em>Configurações</button>
</nav>

</aside>
<main>
<header class="topbar"><div class="heading"><button class="hamb" id="hamb">☰</button><div><h1 id="pageTitle">Dashboard</h1><p id="pageSub">Visão geral da Telle Cosméticos</p></div></div><div class="topActions"><span class="userPill" id="userPill"></span><button class="softBtn" id="logout">Sair</button><button class="primary" id="newSale">＋ Nova venda</button></div></header>
<section class="content" id="content"></section>
</main>
<nav class="bottom" id="bottom"><button data-page="dashboard" class="active"><b>⌂</b>Início</button><button data-page="vendas"><b>🛍️</b>Vendas</button><button data-page="estoque"><b>📦</b>Estoque</button><button data-page="clientes"><b>👥</b>Clientes</button><button data-page="financeiro"><b>☰</b>Mais</button></nav>
</div><div id="modal"></div><div id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";
import { getFirestore, collection, getDocs, doc, setDoc, addDoc, updateDoc, deleteDoc, getDoc, writeBatch } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

const firebaseConfig={
  apiKey:"AIzaSyADx57Ilk5JCaZFoHOeC3APensUHX6P3C4",
  authDomain:"telle-cosmeticos.firebaseapp.com",
  projectId:"telle-cosmeticos",
  storageBucket:"telle-cosmeticos.firebasestorage.app",
  messagingSenderId:"586748451590",
  appId:"1:586748451590:web:222875a9d0b9cd425d5c87",
  measurementId:"G-R0CGN0BP3C"
};
const firebaseApp=initializeApp(firebaseConfig);
const auth=getAuth(firebaseApp), dbCloud=getFirestore(firebaseApp);
const loginBtnEl=document.getElementById("loginBtn");
const loginEmailEl=document.getElementById("loginEmail");
const loginPassEl=document.getElementById("loginPass");
const loginMsgEl=document.getElementById("loginMsg");
const withTimeout=(promise,ms,label)=>Promise.race([promise,new Promise((_,reject)=>setTimeout(()=>reject(new Error(label||"TIMEOUT")),ms))]);
const loginScreen=document.getElementById("login");
const appShell=document.getElementById("app");
const sidebarEl=document.getElementById("sidebar");
const navEl=document.getElementById("nav");
const bottomEl=document.getElementById("bottom");
const hambEl=document.getElementById("hamb");
const newSaleEl=document.getElementById("newSale");
const logoutEl=document.getElementById("logout");
const backupEl=document.getElementById("backup");
const restoreEl=document.getElementById("restore");
const userPillEl=document.getElementById("userPill");

const seed={products:[],clients:[],sales:[],receivables:[],cash:[],suppliers:[],settings:{pix:"",instagram:"@tellecosmeticos"}};
let db={...seed}, uid=null;
const KEY="TELLE_V3_LOCAL_BACKUP";

const copy=x=>JSON.parse(JSON.stringify(x));
const id=()=>Date.now()+Math.floor(Math.random()*100000);
const brl=n=>Number(n||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const day=()=>new Date().toISOString().slice(0,10);
const brdate=s=>s?new Date(s+"T12:00:00").toLocaleDateString("pt-BR"):"-";
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
function toast(s){const e=document.getElementById("toast");e.textContent=s;e.classList.add("toastOn");clearTimeout(window._toast);window._toast=setTimeout(()=>e.classList.remove("toastOn"),2300)}
function closeModal(){document.getElementById("modal").innerHTML=""}
function openModal(title,body,fn,label="Salvar"){
  const host=document.getElementById("modal");
  host.innerHTML='<div class="modalBg"><div class="modal"><div class="modalHead"><h2>'+title+'</h2><button class="close" id="mclose">×</button></div>'+body+'<div class="modalFoot"><button class="softBtn" id="cancel">Cancelar</button><button class="primary" id="action">'+label+'</button></div></div></div>';
  document.getElementById("mclose").onclick=closeModal;
  document.getElementById("cancel").onclick=closeModal;
  document.getElementById("action").onclick=fn;
}

const meta={dashboard:["Dashboard","Visão geral da Telle Cosméticos"],vendas:["Vendas","Vendas, pagamentos e comprovantes"],estoque:["Estoque","Produtos, preços e movimentações"],clientes:["Clientes","Cadastro e histórico"],financeiro:["Financeiro","Entradas, saídas e saldo"],cobrancas:["Cobranças","Valores pendentes e vencimentos"],fornecedores:["Fornecedores","Cadastro de fornecedores"],relatorios:["Relatórios","Desempenho da loja"],config:["Configurações","Dados da Telle"]};
const pages={dashboard,vendas,estoque,clientes,financeiro,cobrancas,fornecedores,relatorios,config};

function saveLocal(){localStorage.setItem(KEY,JSON.stringify(db))}
function loadLocal(){try{return JSON.parse(localStorage.getItem(KEY))||copy(seed)}catch{return copy(seed)}}
function userCol(name){return collection(dbCloud,"users",uid,name)}
function userDoc(name,idv){return doc(dbCloud,"users",uid,name,String(idv))}

async function cloudSave(name,obj){await setDoc(userDoc(name,obj.id),obj)}
async function cloudAdd(name,obj){await setDoc(userDoc(name,obj.id),obj)}
async function cloudUpdate(name,idv,patch){await updateDoc(userDoc(name,idv),patch)}
async function cloudDelete(name,idv){await deleteDoc(userDoc(name,idv))}

async function loadCloud(){
  const result=copy(seed);
  for(const name of ["products","clients","sales","receivables","cash","suppliers"]){
    const snap=await getDocs(userCol(name)); result[name]=snap.docs.map(d=>d.data());
  }
  const s=await getDoc(userDoc("settings","main")); if(s.exists()) result.settings=s.data();
  return result;
}
async function migrateLocalIfCloudEmpty(){
  const local=loadLocal();
  const cloud=await loadCloud();
  const empty=["products","clients","sales","receivables","cash","suppliers"].every(k=>cloud[k].length===0);
  const hasLocal=["products","clients","sales","receivables","cash","suppliers"].some(k=>local[k]?.length);
  if(empty&&hasLocal){
    for(const name of ["products","clients","sales","receivables","cash","suppliers"]){
      for(const obj of local[name]||[]) await cloudAdd(name,obj);
    }
    await setDoc(userDoc("settings","main"),local.settings||seed.settings);
    toast("Dados antigos encontrados. Foram enviados para a nuvem.");
    return await loadCloud();
  }
  return cloud;
}
async function syncFromCloud(){
  db=await migrateLocalIfCloudEmpty();
  saveLocal();
}

async function saveObject(name,obj){db[name]=db[name].filter(x=>x.id!==obj.id);db[name].push(obj);saveLocal();await cloudSave(name,obj)}
async function addObject(name,obj){db[name].push(obj);saveLocal();await cloudAdd(name,obj)}
async function updateObject(name,idv,patch){const i=db[name].findIndex(x=>x.id===idv);if(i>=0)Object.assign(db[name][i],patch);saveLocal();await cloudUpdate(name,idv,patch)}
async function deleteObject(name,idv){db[name]=db[name].filter(x=>x.id!==idv);saveLocal();await cloudDelete(name,idv)}

async function doLogin(){
  const email=loginEmailEl.value.trim(), pass=loginPassEl.value;
  loginMsgEl.textContent="";
  if(!email||!pass){loginMsgEl.textContent="Informe e-mail e senha.";return}
  loginBtnEl.disabled=true;loginBtnEl.textContent="Entrando…";
  try{
    await withTimeout(signInWithEmailAndPassword(auth,email,pass),15000,"AUTH_TIMEOUT");
  }catch(e){
    console.error("Firebase Auth:",e);
    const code=e?.code||"";
    const messages={
      "auth/invalid-credential":"E-mail ou senha incorretos.",
      "auth/invalid-email":"O e-mail não é válido.",
      "auth/user-disabled":"Este usuário está desativado.",
      "auth/too-many-requests":"Muitas tentativas. Aguarde alguns minutos.",
      "auth/network-request-failed":"Sem conexão com o Firebase. Verifique a internet.",
      "auth/operation-not-allowed":"Login por e-mail/senha não está ativado no Firebase.",
      "auth/api-key-not-valid.-please-pass-a-valid-api-key":"A chave do Firebase está inválida."
    };
    loginMsgEl.textContent=messages[code]||(e?.message||"Não foi possível entrar.");
    loginBtnEl.disabled=false;loginBtnEl.textContent="Entrar";
  }
}
loginBtnEl.onclick=doLogin;
loginPassEl.addEventListener("keydown",e=>{if(e.key==="Enter")doLogin()});
logoutEl.onclick=async()=>{try{await signOut(auth)}catch(e){console.error(e)}};
function showLogin(message=""){
  loginScreen.hidden=false;
  appShell.hidden=true;
  loginBtnEl.disabled=false;
  loginBtnEl.textContent="Entrar";
  loginMsgEl.textContent=message;
}
function showApp(){
  loginScreen.hidden=true;
  appShell.hidden=false;
  loginBtnEl.disabled=false;
  loginBtnEl.textContent="Entrar";
}
onAuthStateChanged(auth,async user=>{
  if(!user){showLogin("");return}
  uid=user.uid;
  userPillEl.textContent=user.email||"Usuário";
  loginMsgEl.textContent="Login confirmado. Carregando seus dados…";
  try{
    db=await withTimeout(migrateLocalIfCloudEmpty(),15000,"FIRESTORE_TIMEOUT");
    saveLocal();
    showApp();
    toast("Telle conectada à nuvem ☁️");
    go("dashboard");
  }catch(e){
    console.error("Firebase/Firestore:",e);
    const code=e?.code||"";
    if(code.includes("permission-denied")) showLogin("Login OK, mas o Firestore recusou o acesso. Confira as regras do banco.");
    else if(e?.message==="FIRESTORE_TIMEOUT") showLogin("Login OK, mas o Firestore demorou demais para responder. Verifique a conexão.");
    else showLogin("Login OK, mas não consegui carregar o banco: "+(e?.message||"erro desconhecido"));
  }
});

function go(p){
  if(!pages[p]) return;
  const c=document.getElementById("content");
  c.classList.add("leaving");
  setTimeout(()=>{
    try{
      document.querySelectorAll("[data-page]").forEach(b=>b.classList.toggle("active",b.dataset.page===p));
      document.getElementById("pageTitle").textContent=meta[p][0];
      document.getElementById("pageSub").textContent=meta[p][1];
      sidebarEl.classList.remove("open");
      c.innerHTML=pages[p]();
      c.classList.remove("leaving");
      wire(p);
    }catch(e){
      console.error("Tela:",p,e);
      c.classList.remove("leaving");
      c.innerHTML='<div class="panel"><h3>Não foi possível abrir esta tela</h3><p class="muted">Tente novamente.</p><button class="primary" id="retryPage">Tentar novamente</button></div>';
      document.getElementById("retryPage").onclick=()=>go(p);
    }
  },80);
}
navEl.onclick=e=>{const b=e.target.closest("button");if(b)go(b.dataset.page)}
bottomEl.onclick=e=>{const b=e.target.closest("button");if(b)go(b.dataset.page)}
hambEl.onclick=()=>sidebarEl.classList.toggle("open");
newSaleEl.onclick=newSaleFn;

function sums(){const a=db.sales,r=a.reduce((x,s)=>x+s.total,0),cost=a.reduce((x,s)=>x+s.cost,0);return{r,p:r-cost,o:a.reduce((x,s)=>x+s.total-s.paid,0)}}
function dashboard(){let t=sums(),low=db.products.filter(p=>p.stock<=p.min),open=db.receivables.filter(r=>r.status!=="paid"),d=[],mx=1;for(let i=6;i>=0;i--){let x=new Date();x.setDate(x.getDate()-i);let k=x.toISOString().slice(0,10),v=db.sales.filter(s=>s.created.slice(0,10)===k).reduce((a,s)=>a+s.total,0);d.push({l:x.toLocaleDateString("pt-BR",{weekday:"short"}).replace(".",""),v});mx=Math.max(mx,v)}return'<div class="cards"><div class="card"><div class="eyebrow">Faturamento</div><div class="big">'+brl(t.r)+'</div><div class="muted">total de vendas</div></div><div class="card"><div class="eyebrow">Lucro bruto</div><div class="big green">'+brl(t.p)+'</div><div class="muted">venda menos custo</div></div><div class="card"><div class="eyebrow">A receber</div><div class="big red">'+brl(t.o)+'</div><div class="muted">'+open.length+' pendência(s)</div></div><div class="card"><div class="eyebrow">Estoque baixo</div><div class="big">'+low.length+'</div><div class="muted">produto(s)</div></div></div><div class="layout"><div class="panel"><div class="panelHead"><h3>Vendas da semana</h3><span class="muted">últimos 7 dias</span></div><div class="chart">'+d.map(x=>'<div class="bar" style="height:'+Math.max(5,x.v/mx*170)+'px"><small>'+x.l+'</small></div>').join("")+'</div></div><div class="panel"><div class="panelHead"><h3>Atenção</h3></div>'+open.slice(0,4).map(r=>'<div class="notice over">💳 <b>'+esc(r.client)+'</b> • '+brl(r.amount)+' <button class="softBtn" onclick="charge('+r.saleId+')">WhatsApp</button></div>').join("")+low.slice(0,4).map(p=>'<div class="notice">📦 '+esc(p.name)+' • '+p.stock+' unidade(s)</div>').join("")+(!open.length&&!low.length?'<div class="notice">🌷 Tudo em ordem.</div>':"")+'</div></div><div class="panel" style="margin-top:15px"><div class="panelHead"><h3>Últimas vendas</h3><button class="softBtn" onclick="go(\'vendas\')">Ver todas</button></div>'+salesTable(db.sales.slice().reverse().slice(0,5))+'</div>'}
function status(s){return s.paid>=s.total?'<span class="badge bpaid">Pago</span>':s.paid>0?'<span class="badge bpart">Parcial</span>':'<span class="badge bpending">Pendente</span>'}
function salesTable(a){if(!a.length)return'<div class="empty">Nenhuma venda registrada.</div>';return'<div class="tableWrap"><table class="table"><tr><th>Data</th><th>Cliente</th><th>Total</th><th>Pago</th><th>Status</th><th></th></tr>'+a.map(s=>'<tr><td>'+brdate(s.created.slice(0,10))+'</td><td>'+esc(s.client||"Balcão")+'</td><td>'+brl(s.total)+'</td><td>'+brl(s.paid)+'</td><td>'+status(s)+'</td><td><button class="softBtn" onclick="details('+s.id+')">Abrir</button></td></tr>').join("")+'</table></div>'}
function vendas(){return'<div class="toolbar"><input class="search" id="saleSearch" placeholder="Buscar cliente ou produto"><button class="primary" id="saleNew">＋ Nova venda</button></div><div class="panel" id="salePanel">'+salesTable(db.sales.slice().reverse())+'</div>'}
function newSaleFn(){let p=db.products.filter(x=>x.stock>0);if(!p.length){toast("Cadastre estoque antes de vender.");return}openModal("Nova venda",'<div class="form"><div class="field"><label>Cliente</label><select id="sc"><option value="">Venda balcão</option>'+db.clients.map(c=>'<option value="'+c.id+'">'+esc(c.name)+'</option>').join("")+'</select></div><div class="field"><label>Forma de pagamento</label><select id="sm"><option>PIX</option><option>Dinheiro</option><option>Cartão</option><option>Fiado</option></select></div><div class="field"><label>Produto</label><select id="sp">'+p.map(x=>'<option value="'+x.id+'">'+esc(x.name)+' • '+brl(x.price)+' • '+x.stock+' un.</option>').join("")+'</select></div><div class="field"><label>Quantidade</label><input id="sq" type="number" min="1" value="1"></div><div class="field"><label>Pago agora</label><input id="sPaid" type="number" min="0" step=".01" value="0"></div><div class="field"><label>Vencimento</label><input id="sDue" type="date" value="'+day()+'"></div></div><div class="notice" id="sInfo"></div>',saveSale,"Finalizar venda");$("sp").onchange=preview;$("sq").oninput=preview;preview()}
function preview(){const p=db.products.find(x=>x.id==$("sp").value),q=Math.max(1,Number($("sq").value)||1);sInfo.innerHTML='<b>'+esc(p.name)+'</b> × '+q+' = <b>'+brl(p.price*q)+'</b> <span class="muted">• lucro '+brl((p.price-p.cost)*q)+'</span>'}
async function saveSale(){try{const p=db.products.find(x=>x.id==$("sp").value),q=Math.max(1,Number($("sq").value)||1);if(q>p.stock){toast("Estoque insuficiente.");return}const cid=Number($("sc").value)||null,c=db.clients.find(x=>x.id===cid),total=p.price*q;let paid=Number($("sPaid").value)||0;if($("sm").value!=="Fiado"&&paid===0)paid=total;if(paid>total)paid=total;const s={id:id(),created:new Date().toISOString(),client:c?.name||"",clientId:cid,total,cost:p.cost*q,paid,method:$("sm").value,due:$("sDue").value,items:[{name:p.name,qty:q,price:p.price,cost:p.cost,productId:p.id}]};p.stock-=q;await cloudSave("products",p);db.products=db.products.map(x=>x.id===p.id?p:x);await addObject("sales",s);if(paid)await addObject("cash",{id:id(),date:day(),type:"in",description:"Venda - "+(c?.name||"Balcão"),value:paid});if(paid<total&&c)await addObject("receivables",{id:id(),saleId:s.id,client:c.name,clientId:c.id,amount:total-paid,due:s.due,status:"pending"});closeModal();toast("Venda sincronizada ☁️");details(s.id)}catch(e){console.error(e);toast("Erro ao salvar a venda.")}}
function details(idv){const s=db.sales.find(x=>x.id===idv),r=s.total-s.paid;openModal("Venda #"+String(s.id).slice(-6),'<div class="notice"><b>'+esc(s.client||"Balcão")+'</b><br>'+brdate(s.created.slice(0,10))+' • '+esc(s.method)+'</div>'+salesTable([s])+'<div class="notice">Em aberto: <b class="'+(r?"red":"green")+'">'+brl(r)+'</b></div>',r&&s.client?()=>charge(s.id):()=>receipt(s.id),r&&s.client?"💬 Cobrar WhatsApp":"📄 Gerar PDF")}
function charge(idv){const s=db.sales.find(x=>x.id===idv),c=db.clients.find(x=>x.id===s.clientId),phone=(c?.phone||"").replace(/\D/g,"");if(!phone){toast("Cliente sem WhatsApp cadastrado.");return}const m="🌸 *TELLE COSMÉTICOS*\\n\\nOlá, "+c.name+"! Tudo bem? 💕\\n\\nPassando para lembrar do valor em aberto da sua compra.\\n\\n🧾 Pedido: #"+String(s.id).slice(-6)+"\\n💰 Valor pendente: *"+brl(s.total-s.paid)+"*\\n📅 Vencimento: "+brdate(s.due)+"\\n\\n"+(db.settings.pix?"💳 PIX: "+db.settings.pix+"\\n\\n":"")+"Assim que realizar o pagamento, pode me enviar o comprovante por aqui.\\n\\nObrigada pela preferência! 🌷\\n*Telle Cosméticos*";window.open("https://wa.me/55"+phone+"?text="+encodeURIComponent(m),"_blank")}
function receipt(idv){const s=db.sales.find(x=>x.id===idv),h='<!doctype html><html><head><meta charset="utf-8"><title>Telle #'+String(s.id).slice(-6)+'</title><style>body{font-family:Arial;padding:25px;color:#301622}main{max-width:650px;margin:auto;border:1px solid #ead8e2;border-radius:18px;padding:26px}h1{color:#a51d55;font-family:Georgia}.row{display:flex;justify-content:space-between;border-bottom:1px solid #eee;padding:9px 0}.total{font-size:22px;color:#a51d55;font-weight:bold}.thanks{text-align:center;color:#806a75;margin-top:24px}</style></head><body><main><h1>Telle Cosméticos</h1><p>Comprovante #'+String(s.id).slice(-6)+'<br>'+brdate(s.created.slice(0,10))+'</p><p><b>Cliente:</b> '+esc(s.client||"Balcão")+'</p>'+s.items.map(i=>'<div class="row"><span>'+esc(i.name)+' × '+i.qty+'</span><b>'+brl(i.price*i.qty)+'</b></div>').join("")+'<p class="total">Total: '+brl(s.total)+'</p><p>Pagamento: '+esc(s.method)+'<br>Pago: '+brl(s.paid)+'<br>Em aberto: '+brl(s.total-s.paid)+'</p><div class="thanks">Obrigada pela preferência! 🌷<br>'+esc(db.settings.instagram)+'</div><script>window.onload=()=>setTimeout(()=>window.print(),350)<\/script></main></body></html>';const u=URL.createObjectURL(new Blob([h],{type:"text/html"})),w=window.open(u,"_blank");if(!w)toast("Permita pop-ups no Safari.")}
function clientes(){return'<div class="toolbar"><input class="search" id="clientSearch" placeholder="Buscar cliente"><button class="primary" id="newClient">＋ Novo cliente</button></div><div class="panel" id="clientPanel">'+clientTable(db.clients)+'</div>'}
function clientTable(a){if(!a.length)return'<div class="empty">Nenhum cliente cadastrado.</div>';return'<div class="tableWrap"><table class="table"><tr><th>Cliente</th><th>WhatsApp</th><th>Compras</th><th>Aberto</th><th></th></tr>'+a.map(c=>{const ss=db.sales.filter(s=>s.clientId===c.id),tot=ss.reduce((x,s)=>x+s.total,0),op=ss.reduce((x,s)=>x+s.total-s.paid,0);return'<tr><td><b>'+esc(c.name)+'</b></td><td>'+esc(c.phone||"-")+'</td><td>'+brl(tot)+'</td><td class="'+(op?"red":"")+'">'+brl(op)+'</td><td><button class="softBtn" onclick="historyClient('+c.id+')">Histórico</button></td></tr>'}).join("")+'</table></div>'}
function newClient(){openModal("Novo cliente",'<div class="form"><div class="field"><label>Nome *</label><input id="cn"></div><div class="field"><label>WhatsApp</label><input id="cp" placeholder="47 99999-9999"></div><div class="field"><label>CPF</label><input id="cc"></div><div class="field"><label>Cidade</label><input id="city" value="Joinville"></div><div class="field full"><label>Endereço</label><input id="addr"></div><div class="field full"><label>Observações</label><textarea id="obs"></textarea></div></div>',saveClient)}
async function saveClient(){if(!$("cn").value.trim()){toast("Informe o nome.");return}try{await addObject("clients",{id:id(),name:$("cn").value.trim(),phone:$("cp").value,cpf:$("cc").value,city:$("city").value,address:$("addr").value,obs:$("obs").value});closeModal();toast("Cliente salvo na nuvem.");go("clientes")}catch(e){toast("Erro ao salvar cliente.")}}
function historyClient(idv){const c=db.clients.find(x=>x.id===idv);openModal(esc(c.name),'<div class="notice">WhatsApp: '+esc(c.phone||"-")+'<br>'+esc(c.address||"-")+'</div>'+salesTable(db.sales.filter(s=>s.clientId===idv)),closeModal,"Fechar")}
function estoque(){return'<div class="toolbar"><input class="search" id="productSearch" placeholder="Buscar produto"><button class="primary" id="newProduct">＋ Novo produto</button></div><div class="panel" id="productPanel">'+productTable(db.products)+'</div>'}
function productTable(a){if(!a.length)return'<div class="empty">Nenhum produto.</div>';return'<div class="tableWrap"><table class="table"><tr><th>Produto</th><th>Categoria</th><th>Custo</th><th>Venda</th><th>Margem</th><th>Estoque</th><th></th></tr>'+a.map(p=>{const m=p.price?(p.price-p.cost)/p.price*100:0;return'<tr><td><b>'+esc(p.name)+'</b><br><span class="muted">'+esc(p.brand||"")+'</span></td><td>'+esc(p.category||"-")+'</td><td>'+brl(p.cost)+'</td><td>'+brl(p.price)+'</td><td>'+m.toFixed(1)+'%</td><td class="'+(p.stock<=p.min?"red":"")+'">'+p.stock+(p.stock<=p.min?" ⚠️":"")+'</td><td><button class="softBtn" onclick="move('+p.id+')">Movimentar</button></td></tr>'}).join("")+'</table></div>'}
function newProduct(){openModal("Novo produto",'<div class="form"><div class="field"><label>Nome *</label><input id="pn"></div><div class="field"><label>Marca</label><input id="pb"></div><div class="field"><label>Categoria</label><input id="pc"></div><div class="field"><label>Código</label><input id="psku"></div><div class="field"><label>Custo</label><input id="pco" type="number" step=".01"></div><div class="field"><label>Preço</label><input id="ppr" type="number" step=".01"></div><div class="field"><label>Estoque</label><input id="pst" type="number" min="0" value="0"></div><div class="field"><label>Mínimo</label><input id="pmi" type="number" min="0" value="3"></div></div>',saveProduct)}
async function saveProduct(){if(!$("pn").value.trim()){toast("Informe o nome.");return}try{await addObject("products",{id:id(),name:$("pn").value.trim(),brand:$("pb").value,category:$("pc").value,sku:$("psku").value,cost:Number($("pco").value)||0,price:Number($("ppr").value)||0,stock:Number($("pst").value)||0,min:Number($("pmi").value)||0});closeModal();toast("Produto salvo na nuvem.");go("estoque")}catch(e){toast("Erro ao salvar produto.")}}
async function move(idv){const p=db.products.find(x=>x.id===idv),v=prompt("Quantidade: positivo entra, negativo sai","1");if(v===null)return;const n=Number(v);if(!n||p.stock+n<0){toast("Movimentação inválida.");return}try{p.stock+=n;await cloudSave("products",p);saveLocal();toast("Estoque atualizado na nuvem.");go("estoque")}catch(e){toast("Erro ao atualizar estoque.")}}
function financeiro(){const i=db.cash.filter(x=>x.type==="in").reduce((a,x)=>a+x.value,0),o=db.cash.filter(x=>x.type==="out").reduce((a,x)=>a+x.value,0);return'<div class="cards"><div class="card"><div class="eyebrow">Entradas</div><div class="big green">'+brl(i)+'</div></div><div class="card"><div class="eyebrow">Saídas</div><div class="big red">'+brl(o)+'</div></div><div class="card"><div class="eyebrow">Saldo</div><div class="big">'+brl(i-o)+'</div></div><div class="card"><div class="eyebrow">A receber</div><div class="big red">'+brl(sums().o)+'</div></div></div><div class="layout"><div class="panel"><div class="panelHead"><h3>Recebimentos pendentes</h3><button class="primary" id="expense">＋ Saída</button></div>'+receivableTable()+'</div><div class="panel"><h3>Últimas movimentações</h3>'+db.cash.slice().reverse().slice(0,12).map(x=>'<div class="quick"><span>'+esc(x.description)+'<br><small class="muted">'+brdate(x.date)+'</small></span><b class="'+(x.type==="in"?"green":"red")+'">'+(x.type==="in"?"+":"-")+brl(x.value)+'</b></div>').join("")+'</div></div>'}
function receivableTable(){const a=db.receivables.filter(x=>x.status!=="paid");if(!a.length)return'<div class="empty">Nenhuma pendência.</div>';return'<div class="tableWrap"><table class="table"><tr><th>Cliente</th><th>Valor</th><th>Venc.</th><th></th></tr>'+a.map(r=>'<tr><td>'+esc(r.client)+'</td><td>'+brl(r.amount)+'</td><td>'+brdate(r.due)+'</td><td><button class="softBtn" onclick="charge('+r.saleId+')">WhatsApp</button></td></tr>').join("")+'</table></div>'}
async function expense(){const d=prompt("Descrição da saída:");if(!d)return;const v=Number(prompt("Valor:","0"));if(!v)return;try{await addObject("cash",{id:id(),date:day(),type:"out",description:d,value:v});toast("Saída registrada na nuvem.");go("financeiro")}catch(e){toast("Erro ao registrar saída.")}}
function cobrancas(){return'<div class="cards"><div class="card"><div class="eyebrow">Em aberto</div><div class="big red">'+brl(db.receivables.filter(r=>r.status!=="paid").reduce((a,r)=>a+r.amount,0))+'</div></div><div class="card"><div class="eyebrow">Pendências</div><div class="big">'+db.receivables.filter(r=>r.status!=="paid").length+'</div></div><div class="card"><div class="eyebrow">Vencidas</div><div class="big red">'+db.receivables.filter(r=>r.status!=="paid"&&r.due<day()).length+'</div></div><div class="card"><div class="eyebrow">Pagas</div><div class="big green">'+db.receivables.filter(r=>r.status==="paid").length+'</div></div></div><div class="panel" style="margin-top:15px">'+receivableTable()+'</div>'}
function fornecedores(){return'<div class="toolbar"><button class="primary" id="newSupplier">＋ Novo fornecedor</button></div><div class="panel">'+(db.suppliers.length?'<table class="table"><tr><th>Fornecedor</th><th>Telefone</th><th>Documento</th></tr>'+db.suppliers.map(s=>'<tr><td>'+esc(s.name)+'</td><td>'+esc(s.phone||"-")+'</td><td>'+esc(s.doc||"-")+'</td></tr>').join("")+'</table>':'<div class="empty">Nenhum fornecedor.</div>')+'</div>'}
function newSupplier(){openModal("Novo fornecedor",'<div class="form"><div class="field"><label>Nome *</label><input id="fn"></div><div class="field"><label>Telefone</label><input id="fp"></div><div class="field"><label>CNPJ/CPF</label><input id="fd"></div><div class="field"><label>Observações</label><input id="fo"></div></div>',saveSupplier)}
async function saveSupplier(){if(!$("fn").value.trim()){toast("Informe o nome.");return}try{await addObject("suppliers",{id:id(),name:$("fn").value.trim(),phone:$("fp").value,doc:$("fd").value,obs:$("fo").value});closeModal();toast("Fornecedor salvo na nuvem.");go("fornecedores")}catch(e){toast("Erro ao salvar fornecedor.")}}
function relatorios(){const t=sums(),map={};db.sales.forEach(s=>s.items.forEach(i=>map[i.name]=(map[i.name]||0)+i.qty));const best=Object.entries(map).sort((a,b)=>b[1]-a[1]).slice(0,7),stockCost=db.products.reduce((a,p)=>a+p.cost*p.stock,0),stockSale=db.products.reduce((a,p)=>a+p.price*p.stock,0);return'<div class="cards"><div class="card"><div class="eyebrow">Faturamento</div><div class="big">'+brl(t.r)+'</div></div><div class="card"><div class="eyebrow">Lucro bruto</div><div class="big green">'+brl(t.p)+'</div></div><div class="card"><div class="eyebrow">Margem</div><div class="big">'+(t.r?(t.p/t.r*100).toFixed(1):0)+'%</div></div><div class="card"><div class="eyebrow">Vendas</div><div class="big">'+db.sales.length+'</div></div></div><div class="layout"><div class="panel"><h3>Produtos mais vendidos</h3>'+(best.length?best.map((x,i)=>'<div class="progressRow"><span>'+(i+1)+'. '+esc(x[0])+'</span><div class="progress"><i style="width:'+(x[1]/best[0][1]*100)+'%"></i></div><b>'+x[1]+'</b></div>').join(""):'<div class="empty">Ainda sem vendas.</div>')+'</div><div class="panel"><h3>Valor do estoque</h3><div class="big">'+brl(stockCost)+'</div><div class="muted">a custo</div><hr style="border:0;border-top:1px solid var(--line);margin:18px 0"><div class="big">'+brl(stockSale)+'</div><div class="muted">potencial de venda</div></div></div>'}
function config(){return'<div class="panel"><h3>Dados da Telle</h3><p class="muted">Usados no comprovante e nas cobranças.</p><div class="form" style="margin-top:15px"><div class="field"><label>Chave PIX</label><input id="pix" value="'+esc(db.settings.pix)+'"></div><div class="field"><label>Instagram</label><input id="insta" value="'+esc(db.settings.instagram)+'"></div></div><div class="toolbar" style="margin-top:15px"><button class="primary" id="saveConfig">Salvar</button><button class="danger" onclick="resetData()">Apagar dados locais</button></div><div class="notice" style="margin-top:15px">☁️ <b>Banco conectado:</b> seus dados desta conta são carregados do Firebase Firestore.</div></div>'}
const $=id=>document.getElementById(id);
function wire(p){if(p==="vendas"){$("saleNew").onclick=newSaleFn;$("saleSearch").oninput=e=>{const q=e.target.value.toLowerCase();$("salePanel").innerHTML=salesTable(db.sales.slice().reverse().filter(s=>(s.client||"").toLowerCase().includes(q)||s.items.some(i=>i.name.toLowerCase().includes(q))))}}if(p==="clientes"){$("newClient").onclick=newClient;$("clientSearch").oninput=e=>{const q=e.target.value.toLowerCase();$("clientPanel").innerHTML=clientTable(db.clients.filter(c=>(c.name+" "+(c.phone||"")).toLowerCase().includes(q)))}}if(p==="estoque"){$("newProduct").onclick=newProduct;$("productSearch").oninput=e=>{const q=e.target.value.toLowerCase();$("productPanel").innerHTML=productTable(db.products.filter(p=>(p.name+" "+p.brand+" "+p.category+" "+p.sku).toLowerCase().includes(q)))}}if(p==="financeiro")$("expense").onclick=expense;if(p==="fornecedores")$("newSupplier").onclick=newSupplier;if(p==="config")$("saveConfig").onclick=async()=>{try{db.settings.pix=$("pix").value;db.settings.instagram=$("insta").value;saveLocal();await setDoc(userDoc("settings","main"),db.settings);toast("Configurações salvas na nuvem.")}catch(e){toast("Erro ao salvar configurações.")}}}
function backup(){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:"application/json"}));a.download="telle-v3-backup.json";a.click();toast("Backup baixado.")}
function restoreFile(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=async()=>{try{const x=JSON.parse(r.result);if(!x.products||!x.sales)throw 1;for(const name of ["products","clients","sales","receivables","cash","suppliers"]){for(const obj of x[name]||[])await cloudAdd(name,obj)}if(x.settings){await setDoc(userDoc("settings","main"),x.settings)}db=await loadCloud();saveLocal();toast("Backup restaurado na nuvem.");go("dashboard")}catch(e){console.error(e);toast("Backup inválido ou erro ao restaurar.")}};r.readAsText(f)}
function resetData(){if(confirm("Isso apaga somente o backup local deste aparelho. Os dados da nuvem não serão apagados. Continuar?")){localStorage.removeItem(KEY);toast("Dados locais apagados.")}}
backupEl.onclick=backup;restoreEl.onchange=restoreFile;
window.go=go;window.charge=charge;window.details=details;window.receipt=receipt;window.historyClient=historyClient;window.move=move;window.resetData=resetData;
</script>
