<!doctype html><html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#9d174d">
<title>Telle Cosméticos</title>
<style>
:root{--p:#9d174d;--p2:#7d123f;--r:#fff0f6;--bg:#fff9fc;--ink:#351724;--muted:#806b75;--line:#ecd9e3;--g:#087a55;--red:#c3264c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}
.side{position:fixed;inset:0 auto 0 0;width:245px;background:#fff;border-right:1px solid var(--line);padding:22px 14px;z-index:50}.brand{display:flex;gap:11px;align-items:center;padding:0 8px 24px}.logo{width:45px;height:45px;border-radius:14px;background:linear-gradient(145deg,#c52b70,#7d123f);color:#fff;display:grid;place-items:center;font:bold 25px Georgia}.brand b{display:block;color:var(--p);font:bold 22px Georgia}.brand small{color:var(--muted);font-size:12px}.nav button{width:100%;border:0;background:none;color:#735b67;text-align:left;border-radius:10px;padding:12px;display:flex;gap:12px;align-items:center;margin:3px 0}.nav button.active,.nav button:hover{background:var(--r);color:var(--p);font-weight:700}.nav i{width:21px;text-align:center;font-style:normal}.sidebottom{position:absolute;bottom:18px;left:14px;right:14px;display:flex;gap:7px}.tiny{flex:1;background:var(--r);border:1px solid var(--line);color:var(--p);padding:9px;border-radius:9px;font-weight:700;text-align:center}.tiny input{display:none}
main{margin-left:245px;min-height:100vh}.top{height:80px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:30}.topLeft{display:flex;gap:10px;align-items:center}.menu{display:none;border:0;background:none;font-size:22px}.top h1{margin:0;font-size:22px}.top p{margin:3px 0 0;font-size:13px;color:var(--muted)}.content{padding:24px 28px 90px}.primary{background:var(--p);color:#fff;border:0;border-radius:10px;padding:11px 15px;font-weight:700}.light{background:var(--r);color:var(--p);border:0;border-radius:9px;padding:9px 11px;font-weight:700}.danger{background:#fff0f3;color:var(--red);border:0;border-radius:9px;padding:9px 11px;font-weight:700}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}.card,.panel{background:#fff;border:1px solid var(--line);border-radius:15px;box-shadow:0 8px 28px rgba(70,15,40,.06)}.card{padding:17px}.label{font-size:12px;color:var(--muted)}.value{font-size:23px;font-weight:800;margin:7px 0}.green{color:var(--g)}.red{color:var(--red)}.muted{font-size:12px;color:var(--muted)}.grid{display:grid;grid-template-columns:1.2fr .8fr;gap:15px;margin-top:15px}.panel{padding:17px}.panelHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:13px}.panel h3{margin:0;font-size:16px}.notice{padding:11px;border-radius:10px;background:var(--r);font-size:13px;margin:7px 0}.notice.redbox{background:#fff0f3;color:#a41d40}.chart{height:200px;display:flex;align-items:flex-end;gap:8px;padding:10px 2px 24px}.bar{flex:1;min-height:4px;background:linear-gradient(#f39bc7,var(--p));border-radius:7px 7px 2px 2px;position:relative}.bar small{position:absolute;bottom:-20px;width:100%;text-align:center;color:var(--muted);font-size:10px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.search{flex:1;min-width:190px;border:1px solid var(--line);border-radius:9px;padding:10px;background:#fff;outline:none}.tablewrap{overflow:auto}.table{border-collapse:collapse;width:100%;font-size:13px}.table th,.table td{padding:10px 8px;border-bottom:1px solid #f0e6eb;text-align:left;white-space:nowrap}.table th{font-size:10px;color:var(--muted);text-transform:uppercase}.badge{border-radius:99px;padding:4px 8px;font-size:11px;font-weight:700}.paid{background:#e7f7ef;color:#08764e}.pending{background:#fff4d8;color:#94630a}.partial{background:#eee8fa;color:#63409a}.overdue{background:#ffe7ed;color:#b21d42}.empty{text-align:center;padding:35px;color:var(--muted)}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:10px;background:#fff;color:var(--ink);outline:none}.field textarea{min-height:80px}.full{grid-column:1/-1}.modalbg{position:fixed;inset:0;background:rgba(35,10,23,.5);display:grid;place-items:center;padding:15px;z-index:100}.modal{width:min(730px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:17px;padding:20px}.modalHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.modalHead h2{margin:0;font-size:20px}.close{border:0;background:var(--r);color:var(--p);width:34px;height:34px;border-radius:50%;font-size:20px}.modalFoot{display:flex;justify-content:flex-end;gap:8px;margin-top:17px}.bottomnav{display:none}.progressRow{display:flex;align-items:center;gap:9px;margin:11px 0}.progressRow span{width:135px;font-size:12px}.progress{height:7px;background:#f1e3ea;border-radius:99px;overflow:hidden;flex:1}.progress i{display:block;height:100%;background:var(--p)}
#toast{position:fixed;right:18px;bottom:18px;background:var(--ink);color:#fff;padding:12px 15px;border-radius:10px;opacity:0;transform:translateY(8px);transition:.2s;z-index:200}.show{opacity:1!important;transform:none!important}
@media(max-width:850px){.side{transform:translateX(-100%);transition:.2s}.side.open{transform:translateX(0)}main{margin-left:0}.menu{display:block}.top{padding:0 15px}.content{padding:17px 14px 90px}.cards{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.bottomnav{position:fixed;display:grid;grid-template-columns:repeat(5,1fr);left:0;right:0;bottom:0;height:67px;background:#fff;border-top:1px solid var(--line);z-index:40;padding-bottom:env(safe-area-inset-bottom)}.bottomnav button{border:0;background:none;color:var(--muted);font-size:10px}.bottomnav button.active{color:var(--p);font-weight:700}.bottomnav b{display:block;font-size:20px;margin-bottom:2px}}
@media(max-width:540px){.top h1{font-size:18px}.top p{display:none}.top .primary{font-size:12px;padding:9px 10px}.formgrid{grid-template-columns:1fr}.full{grid-column:auto}.toolbar{display:grid;grid-template-columns:1fr}.toolbar>*{width:100%}.card{padding:13px}.value{font-size:19px}.panel{padding:14px}}
</style></head>
<body>
<aside class="side" id="side"><div class="brand"><div class="logo">T</div><div><b>Telle</b><small>Cosméticos</small></div></div>
<nav class="nav" id="nav"><button data-page="dashboard" class="active"><i>⌂</i>Início</button><button data-page="vendas"><i>🛍️</i>Vendas</button><button data-page="estoque"><i>📦</i>Estoque</button><button data-page="clientes"><i>👥</i>Clientes</button><button data-page="financeiro"><i>💰</i>Financeiro</button><button data-page="cobrancas"><i>📅</i>Cobranças</button><button data-page="fornecedores"><i>🏷️</i>Fornecedores</button><button data-page="relatorios"><i>📊</i>Relatórios</button><button data-page="config"><i>⚙️</i>Configurações</button></nav>
<div class="sidebottom"><button class="tiny" id="backupBtn">↓ Backup</button><label class="tiny">↑ Restaurar<input id="restoreInput" type="file" accept=".json"></label></div></aside>
<main><header class="top"><div class="topLeft"><button class="menu" id="menuBtn">☰</button><div><h1 id="title">Dashboard</h1><p id="sub">Visão geral da Telle Cosméticos</p></div></div><button class="primary" id="topSale">＋ Nova venda</button></header><section class="content" id="content"></section></main>
<nav class="bottomnav" id="bottomnav"><button data-page="dashboard" class="active"><b>⌂</b>Início</button><button data-page="vendas"><b>🛍️</b>Vendas</button><button data-page="estoque"><b>📦</b>Estoque</button><button data-page="clientes"><b>👥</b>Clientes</button><button data-page="config"><b>☰</b>Mais</button></nav>
<div id="modal"></div><div id="toast"></div>
<script>
"use strict";
const KEY="TELLE_COSMETICOS_V2";const seed={products:[{id:1,name:"Body Splash",brand:"Telle",category:"Perfumes",sku:"BS001",cost:12.5,price:20,stock:12,min:3},{id:2,name:"Geleia Corporal 190g",brand:"Soul",category:"Corpo",sku:"GC001",cost:11.29,price:17.9,stock:8,min:3},{id:3,name:"Mousse Micelar Morango 150ml",brand:"Apinil",category:"Skincare",sku:"MM001",cost:10.6,price:16,stock:4,min:3},{id:4,name:"Blush Jelly Tint",brand:"Belle Angel",category:"Maquiagem",sku:"BT001",cost:7.8,price:10.9,stock:2,min:3}],clients:[],suppliers:[],sales:[],cash:[],receivables:[],settings:{pix:"",instagram:"@tellecosmeticos"}};
function clone(x){return JSON.parse(JSON.stringify(x))}function load(){try{let x=JSON.parse(localStorage.getItem(KEY));return x?Object.assign(clone(seed),x):clone(seed)}catch(e){return clone(seed)}}let db=load();function save(){localStorage.setItem(KEY,JSON.stringify(db))}function uid(){return Date.now()+Math.floor(Math.random()*99999)}function money(n){return Number(n||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"})}function today(){return new Date().toISOString().slice(0,10)}function dateBR(s){return s?new Date(s+"T12:00:00").toLocaleDateString("pt-BR"):"-"}function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}function toast(s){let t=document.getElementById("toast");t.textContent=s;t.classList.add("show");clearTimeout(window._t);window._t=setTimeout(()=>t.classList.remove("show"),2200)}function closeModal(){document.getElementById("modal").innerHTML=""}
function modal(title,body,fn,label="Salvar"){document.getElementById("modal").innerHTML='<div class="modalbg"><div class="modal"><div class="modalHead"><h2>'+title+'</h2><button class="close" id="x">×</button></div>'+body+'<div class="modalFoot"><button class="light" id="c">Cancelar</button><button class="primary" id="a">'+label+'</button></div></div></div>';document.getElementById("x").onclick=closeModal;document.getElementById("c").onclick=closeModal;document.getElementById("a").onclick=fn}
const meta={dashboard:["Dashboard","Visão geral da Telle Cosméticos"],vendas:["Vendas","Registre e acompanhe suas vendas"],estoque:["Estoque","Produtos e movimentações"],clientes:["Clientes","Cadastros e histórico"],financeiro:["Financeiro","Caixa e despesas"],cobrancas:["Cobranças","Valores em aberto"],fornecedores:["Fornecedores","Seus fornecedores"],relatorios:["Relatórios","Indicadores da loja"],config:["Configurações","Dados e segurança"]};
function go(p){document.querySelectorAll("#nav button,#bottomnav button").forEach(b=>b.classList.toggle("active",b.dataset.page===p));document.getElementById("title").textContent=meta[p][0];document.getElementById("sub").textContent=meta[p][1];document.getElementById("side").classList.remove("open");document.getElementById("content").innerHTML=pages[p]();wire(p)}
document.getElementById("nav").onclick=e=>{let b=e.target.closest("button");if(b)go(b.dataset.page)};document.getElementById("bottomnav").onclick=e=>{let b=e.target.closest("button");if(b)go(b.dataset.page)};document.getElementById("menuBtn").onclick=()=>document.getElementById("side").classList.toggle("open");document.getElementById("topSale").onclick=openSale;
function totals(){let a=db.sales.filter(s=>!s.cancelled),r=a.reduce((x,s)=>x+s.total,0),c=a.reduce((x,s)=>x+s.cost,0);return{r,c,p:r-c,o:a.reduce((x,s)=>x+s.total-s.paid,0)}}
function dashboard(){let t=totals(),low=db.products.filter(p=>p.stock<=p.min),over=db.receivables.filter(r=>r.status!=="paid"&&r.due<today()),ds=[],mx=1;for(let i=6;i>=0;i--){let d=new Date();d.setDate(d.getDate()-i);let k=d.toISOString().slice(0,10),v=db.sales.filter(s=>!s.cancelled&&s.created.slice(0,10)===k).reduce((a,s)=>a+s.total,0);ds.push({l:d.toLocaleDateString("pt-BR",{weekday:"short"}).replace(".",""),v});mx=Math.max(mx,v)}return'<div class="cards"><div class="card"><div class="label">Faturamento</div><div class="value">'+money(t.r)+'</div><div class="muted">vendas</div></div><div class="card"><div class="label">Lucro bruto</div><div class="value green">'+money(t.p)+'</div><div class="muted">receita menos custo</div></div><div class="card"><div class="label">A receber</div><div class="value red">'+money(t.o)+'</div><div class="muted">pendências</div></div><div class="card"><div class="label">Estoque baixo</div><div class="value">'+low.length+'</div><div class="muted">produtos</div></div></div><div class="grid"><div class="panel"><div class="panelHead"><h3>Vendas dos últimos 7 dias</h3></div><div class="chart">'+ds.map(d=>'<div class="bar" style="height:'+Math.max(4,d.v/mx*170)+'px"><small>'+d.l+'</small></div>').join("")+'</div></div><div class="panel"><div class="panelHead"><h3>Alertas</h3></div>'+over.slice(0,4).map(r=>'<div class="notice redbox">🔴 '+esc(r.client)+' deve '+money(r.amount)+' <button class="light" onclick="sendCharge('+r.saleId+')">WhatsApp</button></div>').join("")+low.slice(0,4).map(p=>'<div class="notice">📦 '+esc(p.name)+': '+p.stock+' unidade(s)</div>').join("")+(!over.length&&!low.length?'<div class="notice">🌷 Tudo certo!</div>':"")+'</div></div><div class="panel" style="margin-top:15px"><div class="panelHead"><h3>Últimas vendas</h3></div>'+salesTable(db.sales.slice().reverse().slice(0,5))+'</div>'}
function badge(s){return s.paid>=s.total?'<span class="badge paid">Pago</span>':s.paid>0?'<span class="badge partial">Parcial</span>':'<span class="badge pending">Pendente</span>'}
function salesTable(a){if(!a.length)return'<div class="empty">Nenhuma venda.</div>';return'<div class="tablewrap"><table class="table"><tr><th>Data</th><th>Cliente</th><th>Total</th><th>Pago</th><th>Status</th><th></th></tr>'+a.map(s=>'<tr><td>'+dateBR(s.created.slice(0,10))+'</td><td>'+esc(s.client||"Balcão")+'</td><td>'+money(s.total)+'</td><td>'+money(s.paid)+'</td><td>'+badge(s)+'</td><td><button class="light" onclick="saleDetails('+s.id+')">Abrir</button></td></tr>').join("")+'</table></div>'}
function vendas(){return'<div class="toolbar"><input class="search" id="saleSearch" placeholder="Buscar cliente ou produto..."><button class="primary" id="saleNew">＋ Nova venda</button></div><div class="panel" id="salesPanel">'+salesTable(db.sales.slice().reverse())+'</div>'}
function openSale(){let ps=db.products.filter(p=>p.stock>0);if(!ps.length){toast("Não há estoque disponível.");return}modal("Nova venda",'<div class="formgrid"><div class="field"><label>Cliente</label><select id="svClient"><option value="">Venda balcão</option>'+db.clients.map(c=>'<option value="'+c.id+'">'+esc(c.name)+'</option>').join("")+'</select></div><div class="field"><label>Pagamento</label><select id="svMethod"><option>PIX</option><option>Dinheiro</option><option>Cartão</option><option>Fiado</option></select></div><div class="field"><label>Produto</label><select id="svProduct">'+ps.map(p=>'<option value="'+p.id+'">'+esc(p.name)+' | '+money(p.price)+' | estoque '+p.stock+'</option>').join("")+'</select></div><div class="field"><label>Quantidade</label><input id="svQty" type="number" min="1" value="1"></div><div class="field"><label>Valor pago</label><input id="svPaid" type="number" min="0" step=".01" value="0"></div><div class="field"><label>Vencimento</label><input id="svDue" type="date" value="'+today()+'"></div></div><div class="notice" id="svInfo"></div>',saveSale,"Finalizar venda");document.getElementById("svProduct").onchange=previewSale;document.getElementById("svQty").oninput=previewSale;previewSale()}
function previewSale(){let p=db.products.find(x=>x.id==document.getElementById("svProduct").value),q=Math.max(1,Number(document.getElementById("svQty").value)||1);document.getElementById("svInfo").innerHTML='<b>'+esc(p.name)+'</b> × '+q+' = <b>'+money(p.price*q)+'</b><br><span class="muted">Lucro: '+money((p.price-p.cost)*q)+'</span>'}
function saveSale(){let p=db.products.find(x=>x.id==document.getElementById("svProduct").value),q=Math.max(1,Number(document.getElementById("svQty").value)||1);if(q>p.stock){toast("Estoque insuficiente.");return}let cid=Number(document.getElementById("svClient").value)||null,c=db.clients.find(x=>x.id===cid),total=p.price*q,method=document.getElementById("svMethod").value,paid=Number(document.getElementById("svPaid").value)||0;if(method!=="Fiado"&&paid===0)paid=total;if(paid>total)paid=total;let s={id:uid(),created:new Date().toISOString(),client:c?c.name:"",clientId:cid,total,cost:p.cost*q,paid,method,due:document.getElementById("svDue").value,items:[{productId:p.id,name:p.name,qty:q,price:p.price,cost:p.cost}]};db.sales.push(s);p.stock-=q;if(paid)db.cash.push({id:uid(),date:today(),type:"in",description:"Venda - "+(c?c.name:"Balcão"),value:paid});if(paid<total&&c)db.receivables.push({id:uid(),saleId:s.id,client:c.name,clientId:cid,amount:total-paid,due:s.due,status:"pending"});save();closeModal();toast("Venda registrada.");saleDetails(s.id)}
function saleDetails(id){let s=db.sales.find(x=>x.id===id),rest=s.total-s.paid;modal("Venda #"+String(s.id).slice(-6),'<div class="notice"><b>'+esc(s.client||"Balcão")+'</b><br>'+dateBR(s.created.slice(0,10))+' • '+esc(s.method)+'</div>'+salesTable([s])+'<div class="notice">Em aberto: <b class="'+(rest?"red":"green")+'">'+money(rest)+'</b></div>',rest&&s.client?()=>sendCharge(s.id):()=>generateReceipt(s.id),rest&&s.client?"💬 Cobrar WhatsApp":"📄 Gerar PDF")}
function receivePayment(id){let s=db.sales.find(x=>x.id===id),rest=s.total-s.paid,v=prompt("Valor recebido (máximo "+money(rest)+"):",rest.toFixed(2));if(v===null)return;let n=Number(v);if(!n||n>rest){toast("Valor inválido.");return}s.paid+=n;db.cash.push({id:uid(),date:today(),type:"in",description:"Recebimento - "+(s.client||"venda"),value:n});let r=db.receivables.find(x=>x.saleId===id&&x.status!=="paid");if(r){r.amount=Math.max(0,r.amount-n);if(r.amount===0)r.status="paid"}save();toast("Pagamento registrado.");go("cobrancas")}
function sendCharge(id){let s=db.sales.find(x=>x.id===id),c=db.clients.find(x=>x.id===s.clientId),phone=(c?.phone||"").replace(/\D/g,"");if(!phone){toast("Cliente sem WhatsApp cadastrado.");return}let msg="🌸 *TELLE COSMÉTICOS*\\n\\nOlá, "+c.name+"! Tudo bem? 💕\\n\\nPassando para lembrar do valor em aberto da sua compra.\\n\\n🧾 Pedido: #"+String(s.id).slice(-6)+"\\n💰 Valor pendente: *"+money(s.total-s.paid)+"*\\n📅 Vencimento: "+dateBR(s.due)+"\\n\\n"+(db.settings.pix?"💳 PIX: "+db.settings.pix+"\\n\\n":"")+"Assim que realizar o pagamento, pode me enviar o comprovante por aqui.\\n\\nObrigada pela preferência! 🌷";window.open("https://wa.me/55"+phone+"?text="+encodeURIComponent(msg),"_blank")}
function generateReceipt(id){let s=db.sales.find(x=>x.id===id),html='<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Comprovante Telle</title><style>body{font-family:Arial;padding:25px;color:#351724}main{max-width:650px;margin:auto;border:1px solid #ead9e3;border-radius:18px;padding:25px}h1{color:#9d174d;font-family:Georgia}.row{display:flex;justify-content:space-between;border-bottom:1px solid #eee;padding:9px 0}.total{font-size:22px;color:#9d174d;font-weight:bold}.thanks{text-align:center;color:#806b75;margin-top:25px}</style></head><body><main><h1>Telle Cosméticos</h1><p>Comprovante #'+String(s.id).slice(-6)+'<br>'+dateBR(s.created.slice(0,10))+'</p><p><b>Cliente:</b> '+esc(s.client||"Balcão")+'</p>'+s.items.map(i=>'<div class="row"><span>'+esc(i.name)+' × '+i.qty+'</span><b>'+money(i.price*i.qty)+'</b></div>').join("")+'<p class="total">Total: '+money(s.total)+'</p><p>Pagamento: '+esc(s.method)+'<br>Pago: '+money(s.paid)+'<br>Em aberto: '+money(s.total-s.paid)+'</p><div class="thanks">Obrigada pela preferência! 🌷<br>'+esc(db.settings.instagram)+'</div><script>window.onload=function(){setTimeout(function(){window.print()},300)}<\/script></main></body></html>';let u=URL.createObjectURL(new Blob([html],{type:"text/html"})),w=window.open(u,"_blank");if(!w)toast("Permita pop-ups no Safari.")}
function clientes(){return'<div class="toolbar"><input class="search" id="clientSearch" placeholder="Buscar cliente..."><button class="primary" id="clientNew">＋ Novo cliente</button></div><div class="panel" id="clientPanel">'+clientTable(db.clients)+'</div>'}
function clientTable(a){if(!a.length)return'<div class="empty">Nenhum cliente cadastrado.</div>';return'<div class="tablewrap"><table class="table"><tr><th>Cliente</th><th>WhatsApp</th><th>Compras</th><th>Aberto</th><th></th></tr>'+a.map(c=>{let ss=db.sales.filter(s=>s.clientId===c.id),tot=ss.reduce((x,s)=>x+s.total,0),op=ss.reduce((x,s)=>x+s.total-s.paid,0);return'<tr><td><b>'+esc(c.name)+'</b></td><td>'+esc(c.phone||"-")+'</td><td>'+money(tot)+'</td><td class="'+(op?"red":"")+'">'+money(op)+'</td><td><button class="light" onclick="clientHistory('+c.id+')">Histórico</button></td></tr>'}).join("")+'</table></div>'}
function openClient(){modal("Novo cliente",'<div class="formgrid"><div class="field"><label>Nome *</label><input id="cName"></div><div class="field"><label>WhatsApp</label><input id="cPhone" placeholder="47 99999-9999"></div><div class="field"><label>CPF</label><input id="cCpf"></div><div class="field"><label>Cidade</label><input id="cCity" value="Joinville"></div><div class="field full"><label>Endereço</label><input id="cAddress"></div><div class="field full"><label>Observações</label><textarea id="cObs"></textarea></div></div>',saveClient)}
function saveClient(){let name=document.getElementById("cName").value.trim();if(!name){toast("Informe o nome.");return}db.clients.push({id:uid(),name,phone:document.getElementById("cPhone").value,cpf:document.getElementById("cCpf").value,city:document.getElementById("cCity").value,address:document.getElementById("cAddress").value,obs:document.getElementById("cObs").value});save();closeModal();toast("Cliente cadastrado.");go("clientes")}
function clientHistory(id){let c=db.clients.find(x=>x.id===id);modal(esc(c.name),'<div class="notice">WhatsApp: '+esc(c.phone||"-")+'<br>Endereço: '+esc(c.address||"-")+'</div>'+salesTable(db.sales.filter(s=>s.clientId===id)),closeModal,"Fechar")}
function estoque(){return'<div class="toolbar"><input class="search" id="prodSearch" placeholder="Buscar produto..."><button class="primary" id="prodNew">＋ Novo produto</button></div><div class="panel" id="prodPanel">'+productTable(db.products)+'</div>'}
function productTable(a){if(!a.length)return'<div class="empty">Nenhum produto.</div>';return'<div class="tablewrap"><table class="table"><tr><th>Produto</th><th>Categoria</th><th>Custo</th><th>Venda</th><th>Margem</th><th>Estoque</th><th></th></tr>'+a.map(p=>{let m=p.price?(p.price-p.cost)/p.price*100:0;return'<tr><td><b>'+esc(p.name)+'</b><br><span class="muted">'+esc(p.brand||"")+'</span></td><td>'+esc(p.category||"-")+'</td><td>'+money(p.cost)+'</td><td>'+money(p.price)+'</td><td>'+m.toFixed(1)+'%</td><td class="'+(p.stock<=p.min?"red":"")+'">'+p.stock+(p.stock<=p.min?" ⚠️":"")+'</td><td><button class="light" onclick="moveStock('+p.id+')">Movimentar</button></td></tr>'}).join("")+'</table></div>'}
function openProduct(){modal("Novo produto",'<div class="formgrid"><div class="field"><label>Nome *</label><input id="pName"></div><div class="field"><label>Marca</label><input id="pBrand"></div><div class="field"><label>Categoria</label><input id="pCat"></div><div class="field"><label>Código</label><input id="pSku"></div><div class="field"><label>Custo</label><input id="pCost" type="number" step=".01"></div><div class="field"><label>Preço</label><input id="pPrice" type="number" step=".01"></div><div class="field"><label>Estoque inicial</label><input id="pStock" type="number" min="0" value="0"></div><div class="field"><label>Estoque mínimo</label><input id="pMin" type="number" min="0" value="3"></div></div>',saveProduct)}
function saveProduct(){let name=document.getElementById("pName").value.trim();if(!name){toast("Informe o nome.");return}db.products.push({id:uid(),name,brand:document.getElementById("pBrand").value,category:document.getElementById("pCat").value,sku:document.getElementById("pSku").value,cost:Number(document.getElementById("pCost").value)||0,price:Number(document.getElementById("pPrice").value)||0,stock:Number(document.getElementById("pStock").value)||0,min:Number(document.getElementById("pMin").value)||0});save();closeModal();toast("Produto cadastrado.");go("estoque")}
function moveStock(id){let p=db.products.find(x=>x.id===id),v=prompt("Quantidade: positivo entra, negativo sai","1");if(v===null)return;let n=Number(v);if(!n||p.stock+n<0){toast("Movimentação inválida.");return}p.stock+=n;save();toast("Estoque atualizado.");go("estoque")}
function financeiro(){let ins=db.cash.filter(x=>x.type==="in").reduce((a,x)=>a+x.value,0),out=db.cash.filter(x=>x.type==="out").reduce((a,x)=>a+x.value,0);return'<div class="cards"><div class="card"><div class="label">Entradas</div><div class="value green">'+money(ins)+'</div></div><div class="card"><div class="label">Saídas</div><div class="value red">'+money(out)+'</div></div><div class="card"><div class="label">Saldo</div><div class="value">'+money(ins-out)+'</div></div><div class="card"><div class="label">A receber</div><div class="value">'+money(totals().o)+'</div></div></div><div class="grid"><div class="panel"><div class="panelHead"><h3>Contas a receber</h3><button class="primary" id="expenseBtn">＋ Lançar saída</button></div>'+cobrancaTable()+'</div><div class="panel"><div class="panelHead"><h3>Movimentações</h3></div>'+db.cash.slice().reverse().slice(0,15).map(x=>'<div class="quick-row"><span>'+esc(x.description)+'<br><small class="muted">'+dateBR(x.date)+'</small></span><b class="'+(x.type==="in"?"green":"red")+'">'+(x.type==="in"?"+":"-")+money(x.value)+'</b></div>').join("")+'</div></div>'}
function cobrancaTable(){let a=db.receivables.filter(r=>r.status!=="paid");if(!a.length)return'<div class="empty">Nenhuma cobrança.</div>';return'<div class="tablewrap"><table class="table"><tr><th>Cliente</th><th>Valor</th><th>Vencimento</th><th></th></tr>'+a.map(r=>'<tr><td>'+esc(r.client)+'</td><td>'+money(r.amount)+'</td><td>'+dateBR(r.due)+'</td><td><button class="light" onclick="sendCharge('+r.saleId+')">WhatsApp</button></td></tr>').join("")+'</table></div>'}
function cobrancas(){return'<div class="panel"><div class="panelHead"><h3>Cobranças em aberto</h3></div>'+cobrancaTable()+'</div>'}
function expense(){let d=prompt("Descrição da saída:");if(!d)return;let v=Number(prompt("Valor:","0"));if(!v)return;db.cash.push({id:uid(),date:today(),type:"out",description:d,value:v});save();toast("Saída registrada.");go("financeiro")}
function fornecedores(){return'<div class="toolbar"><button class="primary" id="supplierNew">＋ Novo fornecedor</button></div><div class="panel">'+(db.suppliers.length?'<table class="table"><tr><th>Fornecedor</th><th>Telefone</th><th>Documento</th></tr>'+db.suppliers.map(s=>'<tr><td>'+esc(s.name)+'</td><td>'+esc(s.phone||"-")+'</td><td>'+esc(s.doc||"-")+'</td></tr>').join("")+'</table>':'<div class="empty">Nenhum fornecedor.</div>')+'</div>'}
function openSupplier(){modal("Novo fornecedor",'<div class="formgrid"><div class="field"><label>Nome *</label><input id="fName"></div><div class="field"><label>Telefone</label><input id="fPhone"></div><div class="field"><label>CNPJ/CPF</label><input id="fDoc"></div><div class="field"><label>Observações</label><input id="fObs"></div></div>',saveSupplier)}
function saveSupplier(){let name=document.getElementById("fName").value.trim();if(!name){toast("Informe o nome.");return}db.suppliers.push({id:uid(),name,phone:document.getElementById("fPhone").value,doc:document.getElementById("fDoc").value,obs:document.getElementById("fObs").value});save();closeModal();toast("Fornecedor cadastrado.");go("fornecedores")}
function relatorios(){let t=totals(),map={};db.sales.forEach(s=>s.items.forEach(i=>map[i.name]=(map[i.name]||0)+i.qty));let best=Object.entries(map).sort((a,b)=>b[1]-a[1]).slice(0,8),sc=db.products.reduce((a,p)=>a+p.cost*p.stock,0),ss=db.products.reduce((a,p)=>a+p.price*p.stock,0);return'<div class="cards"><div class="card"><div class="label">Faturamento</div><div class="value">'+money(t.r)+'</div></div><div class="card"><div class="label">Lucro</div><div class="value green">'+money(t.p)+'</div></div><div class="card"><div class="label">Margem</div><div class="value">'+(t.r?(t.p/t.r*100).toFixed(1):0)+'%</div></div><div class="card"><div class="label">Vendas</div><div class="value">'+db.sales.length+'</div></div></div><div class="grid"><div class="panel"><div class="panelHead"><h3>Mais vendidos</h3></div>'+(best.length?best.map((x,i)=>'<div class="progressRow"><span>'+(i+1)+'. '+esc(x[0])+'</span><div class="progress"><i style="width:'+(x[1]/best[0][1]*100)+'%"></i></div><b>'+x[1]+'</b></div>').join(""):'<div class="empty">Ainda não há vendas.</div>')+'</div><div class="panel"><h3>Estoque</h3><div class="value">'+money(sc)+'</div><div class="muted">pelo custo</div><hr style="border:0;border-top:1px solid var(--line);margin:18px 0"><div class="value">'+money(ss)+'</div><div class="muted">potencial de venda</div></div></div>'}
function config(){return'<div class="panel"><h3>Configurações</h3><p class="muted">Usadas no comprovante e cobrança.</p><div class="formgrid"><div class="field"><label>Chave PIX</label><input id="pix" value="'+esc(db.settings.pix)+'"></div><div class="field"><label>Instagram</label><input id="insta" value="'+esc(db.settings.instagram)+'"></div></div><div class="toolbar" style="margin-top:15px"><button class="primary" id="saveSet">Salvar</button><button class="danger" onclick="resetData()">Apagar dados</button></div></div>'}
function wire(p){if(p==="vendas"){document.getElementById("saleNew").onclick=openSale;document.getElementById("saleSearch").oninput=e=>{let q=e.target.value.toLowerCase();document.getElementById("salesPanel").innerHTML=salesTable(db.sales.slice().reverse().filter(s=>(s.client||"").toLowerCase().includes(q)||s.items.some(i=>i.name.toLowerCase().includes(q))))}}if(p==="clientes"){document.getElementById("clientNew").onclick=openClient;document.getElementById("clientSearch").oninput=e=>{let q=e.target.value.toLowerCase();document.getElementById("clientPanel").innerHTML=clientTable(db.clients.filter(c=>(c.name+" "+(c.phone||"")).toLowerCase().includes(q)))}}if(p==="estoque"){document.getElementById("prodNew").onclick=openProduct;document.getElementById("prodSearch").oninput=e=>{let q=e.target.value.toLowerCase();document.getElementById("prodPanel").innerHTML=productTable(db.products.filter(x=>(x.name+" "+x.brand+" "+x.category+" "+x.sku).toLowerCase().includes(q)))}}if(p==="financeiro")document.getElementById("expenseBtn").onclick=expense;if(p==="fornecedores")document.getElementById("supplierNew").onclick=openSupplier;if(p==="config")document.getElementById("saveSet").onclick=()=>{db.settings.pix=document.getElementById("pix").value;db.settings.instagram=document.getElementById("insta").value;save();toast("Configurações salvas.")}}
function backup(){let a=document.createElement("a"),u=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:"application/json"}));a.href=u;a.download="telle-cosmeticos-backup.json";document.body.appendChild(a);a.click();a.remove();toast("Backup baixado.")}
function restore(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.products||!x.sales)throw Error();db=x;save();toast("Backup restaurado.");go("dashboard")}catch(err){toast("Backup inválido.")}};r.readAsText(f)}
function resetData(){if(confirm("Apagar todos os dados?")){localStorage.removeItem(KEY);location.reload()}}
const pages={dashboard,vendas,estoque,clientes,financeiro,cobrancas,fornecedores,relatorios,config};window.go=go;window.openSale=openSale;window.receivePayment=receivePayment;window.saleDetails=saleDetails;window.sendCharge=sendCharge;window.generateReceipt=generateReceipt;window.clientHistory=clientHistory;window.moveStock=moveStock;window.backup=backup;window.resetData=resetData;
document.getElementById("backupBtn").onclick=backup;document.getElementById("restoreInput").onchange=restore;go("dashboard");
</script></body></html>
