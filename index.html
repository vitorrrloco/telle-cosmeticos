/* V4 visual system */

  --pink:#c52d70;--pink2:#9d1854;--soft:#fff0f6;--soft2:#fbe0ec;

.sidebar{width:258px;padding:18px 12px;background:rgba(255,255,255,.9);backdrop-filter:blur(18px);box-shadow:8px 0 35px rgba(100,20,55,.03)}

main{margin-left:258px}

.toolbar{margin-bottom:15px}
.search{padding:12px 14px;border-radius:13px;box-shadow:0 4px 15px rgba(100,20,55,.03)}
.table{font-size:13px}

.modal{border-radius:24px;padding:22px}

.quick{padding:13px 0}
.bottom{height:72px;box-shadow:0 -10px 30px rgba(100,20,55,.06)}

@media(max-width:900px){
  .sidebar{width:280px}
  main{margin-left:0}

<script>
/* TELLE COSMÉTICOS V4 - Firebase REST runtime
   No ES modules, no SDK race, no duplicated login handlers.
   Designed for GitHub Pages + Safari/iPhone.
*/
(function(){
'use strict';

const API_KEY='AIzaSyADx57Ilk5JCaZFoHOeC3APensUHX6P3C4';
const PROJECT='telle-cosmeticos';
const DB='(default)';
const AUTH_KEY='TELLE_V4_AUTH';
const LOCAL_KEY='TELLE_V4_LOCAL_BACKUP';
const ROOT='https://firestore.googleapis.com/v1/projects/'+PROJECT+'/databases/'+DB+'/documents';
const AUTH_URL='https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key='+encodeURIComponent(API_KEY);
const REFRESH_URL='https://securetoken.googleapis.com/v1/token?key='+encodeURIComponent(API_KEY);

const seed={products:[],clients:[],sales:[],receivables:[],cash:[],suppliers:[],settings:{pix:'',instagram:'@tellecosmeticos'}};
let db=copy(seed), uid=null, accessToken=null, refreshToken=null, userEmail='';
let refreshPromise=null;

function copy(x){return JSON.parse(JSON.stringify(x));}
function id(){return Date.now()+Math.floor(Math.random()*100000);}
function brl(n){return Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});}
function day(){return new Date().toISOString().slice(0,10);}
function brdate(s){return s?new Date(s+'T12:00:00').toLocaleDateString('pt-BR'):'-';}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function $(idv){return document.getElementById(idv);}
function toast(s){const e=$('toast');if(!e)return;e.textContent=s;e.classList.add('toastOn');clearTimeout(window._toast);window._toast=setTimeout(()=>e.classList.remove('toastOn'),2400);}
function closeModal(){const e=$('modal');if(e)e.innerHTML='';}
function openModal(title,body,fn,label='Salvar'){
 const host=$('modal');
 host.innerHTML='<div class="modalBg"><div class="modal"><div class="modalHead"><h2>'+title+'</h2><button class="close" id="mclose" type="button">×</button></div>'+body+'<div class="modalFoot"><button class="softBtn" id="cancel" type="button">Cancelar</button><button class="primary" id="action" type="button">'+label+'</button></div></div></div>';
 $('mclose').onclick=closeModal;$('cancel').onclick=closeModal;$('action').onclick=async()=>{try{await fn();}catch(e){console.error(e);toast('Ocorreu um erro.');}};
}

const meta={dashboard:['Dashboard','Visão geral da Telle Cosméticos'],vendas:['Vendas','Vendas, pagamentos e comprovantes'],estoque:['Estoque','Produtos, preços e movimentações'],clientes:['Clientes','Cadastro e histórico'],financeiro:['Financeiro','Entradas, saídas e saldo'],cobrancas:['Cobranças','Valores pendentes e vencimentos'],fornecedores:['Fornecedores','Cadastro de fornecedores'],relatorios:['Relatórios','Desempenho da loja'],config:['Configurações','Dados da Telle']};
const pages={dashboard,vendas,estoque,clientes,financeiro,cobrancas,fornecedores,relatorios,config};

function authStore(){try{return JSON.parse(localStorage.getItem(AUTH_KEY)||'null')}catch{return null}}
function saveAuth(a){localStorage.setItem(AUTH_KEY,JSON.stringify(a));}
function clearAuth(){localStorage.removeItem(AUTH_KEY);accessToken=null;refreshToken=null;uid=null;userEmail='';}

async function authLogin(email,password){
 const r=await fetch(AUTH_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password,returnSecureToken:true})});
 const j=await r.json();
 if(!r.ok){const code=j?.error?.message||'';const map={'INVALID_LOGIN_CREDENTIALS':'E-mail ou senha incorretos.','EMAIL_NOT_FOUND':'E-mail ou senha incorretos.','INVALID_PASSWORD':'E-mail ou senha incorretos.','INVALID_EMAIL':'O e-mail não é válido.','USER_DISABLED':'Este usuário está desativado.','TOO_MANY_ATTEMPTS_TRY_LATER':'Muitas tentativas. Aguarde alguns minutos.','OPERATION_NOT_ALLOWED':'O login por e-mail/senha não está ativado no Firebase.','API_KEY_INVALID':'A chave do Firebase está inválida.'};throw new Error(map[code]||'Não foi possível entrar: '+code)}
 accessToken=j.idToken;refreshToken=j.refreshToken;uid=j.localId;userEmail=j.email||email;
 saveAuth({idToken:accessToken,refreshToken,localId:uid,email:userEmail,expiresAt:Date.now()+Number(j.expiresIn||3600)*1000});
}

async function authRefresh(){
 const a=authStore(); if(!a?.refreshToken)throw new Error('NO_AUTH');
 if(refreshPromise)return refreshPromise;
 refreshPromise=(async()=>{
  const r=await fetch(REFRESH_URL,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'grant_type=refresh_token&refresh_token='+encodeURIComponent(a.refreshToken)});
  const j=await r.json();
  if(!r.ok)throw new Error('REFRESH_FAILED');
  accessToken=j.id_token;refreshToken=j.refresh_token||a.refreshToken;uid=j.user_id||a.localId;userEmail=a.email||'';
  saveAuth({idToken:accessToken,refreshToken,localId:uid,email:userEmail,expiresAt:Date.now()+Number(j.expires_in||3600)*1000});
 })().finally(()=>{refreshPromise=null});
 return refreshPromise;
}

async function ensureAuth(){
 const a=authStore();
 if(!a?.idToken||!a?.localId) return false;
 accessToken=a.idToken;refreshToken=a.refreshToken;uid=a.localId;userEmail=a.email||'';
 if(a.expiresAt && Date.now()>a.expiresAt-60000){try{await authRefresh()}catch{clearAuth();return false}}
 return true;
}

async function apiFetch(url,options={},retry=true){
 const h=new Headers(options.headers||{});h.set('Authorization','Bearer '+accessToken);h.set('Content-Type','application/json');
 let r=await fetch(url,{...options,headers:h});
 if(r.status===401 && retry){try{await authRefresh();return apiFetch(url,options,false)}catch{clearAuth();showLogin('Sua sessão expirou. Entre novamente.');throw new Error('AUTH_EXPIRED')}}
 return r;
}

function fsEncode(v){
 if(v===null)return {nullValue:null};
 if(typeof v==='boolean')return {booleanValue:v};
 if(typeof v==='number'){if(Number.isInteger(v))return {integerValue:String(v)};return {doubleValue:v};}
 if(typeof v==='string')return {stringValue:v};
 if(Array.isArray(v))return {arrayValue:{values:v.map(fsEncode)}};
 if(typeof v==='object')return {mapValue:{fields:Object.fromEntries(Object.entries(v).map(([k,val])=>[k,fsEncode(val)]))}};
 return {stringValue:String(v)};
}
function fsDecode(v){
 if(!v)return null;
 if('nullValue'in v)return null;
 if('stringValue'in v)return v.stringValue;
 if('booleanValue'in v)return v.booleanValue;
 if('integerValue'in v)return Number(v.integerValue);
 if('doubleValue'in v)return Number(v.doubleValue);
 if('timestampValue'in v)return v.timestampValue;
 if('arrayValue'in v)return (v.arrayValue.values||[]).map(fsDecode);
 if('mapValue'in v)return Object.fromEntries(Object.entries(v.mapValue.fields||{}).map(([k,x])=>[k,fsDecode(x)]));
 return null;
}
function encodeDoc(obj){return {fields:Object.fromEntries(Object.entries(obj).map(([k,v])=>[k,fsEncode(v)]))};}
function decodeDoc(doc){return Object.fromEntries(Object.entries(doc.fields||{}).map(([k,v])=>[k,fsDecode(v)]));}
function docUrl(name,idv){return ROOT+'/users/'+encodeURIComponent(uid)+'/'+encodeURIComponent(name)+'/'+encodeURIComponent(String(idv));}
function colUrl(name){return ROOT+'/users/'+encodeURIComponent(uid)+'/'+encodeURIComponent(name)+'?pageSize=1000';}

async function cloudGetCollection(name){
 const r=await apiFetch(colUrl(name));
 if(r.status===404)return [];
 if(!r.ok)throw new Error('FIRESTORE_'+r.status);
 const j=await r.json();return (j.documents||[]).map(decodeDoc);
}
async function cloudGetDoc(name,idv){
 const r=await apiFetch(docUrl(name,idv));
 if(r.status===404)return null;if(!r.ok)throw new Error('FIRESTORE_'+r.status);return decodeDoc(await r.json());
}
async function cloudPut(name,obj){
 const r=await apiFetch(docUrl(name,obj.id),{method:'PATCH',body:JSON.stringify(encodeDoc(obj))});
 if(!r.ok)throw new Error('FIRESTORE_'+r.status);return decodeDoc(await r.json());
}
async function cloudDelete(name,idv){const r=await apiFetch(docUrl(name,idv),{method:'DELETE'});if(!r.ok&&r.status!==404)throw new Error('FIRESTORE_'+r.status);}
async function cloudLoad(){
 const out=copy(seed);
 for(const name of ['products','clients','sales','receivables','cash','suppliers'])out[name]=await cloudGetCollection(name);
 const settings=await cloudGetDoc('settings','main');if(settings)out.settings=settings;
 return out;
}

function loadLocal(){try{return JSON.parse(localStorage.getItem(LOCAL_KEY))||copy(seed)}catch{return copy(seed)}}
async function migrateLocalIfCloudEmpty(){
 const cloud=await cloudLoad(), local=loadLocal();
 const empty=['products','clients','sales','receivables','cash','suppliers'].every(k=>cloud[k].length===0);
 const hasLocal=['products','clients','sales','receivables','cash','suppliers'].some(k=>(local[k]||[]).length);
 if(empty&&hasLocal){
  for(const name of ['products','clients','sales','receivables','cash','suppliers'])for(const obj of local[name]||[])await cloudPut(name,obj);
  await cloudPut('settings',{id:'main',...(local.settings||seed.settings)});
  toast('Dados antigos encontrados e enviados para a nuvem.');
  return await cloudLoad();
 }
 return cloud;
}

function fornecedores(){return '<div class="toolbar"><button class="primary" id="newSupplier" type="button">＋ Novo fornecedor</button></div><div class="panel">'+(db.suppliers.length?'<table class="table"><tr><th>Fornecedor</th><th>Telefone</th><th>Documento</th></tr>'+db.suppliers.map(s=>'<tr><td>'+esc(s.name)+'</td><td>'+esc(s.phone||'-')+'</td><td>'+esc(s.doc||'-')+'</td></tr>').join('')+'</table>':'<div class="empty">Nenhum fornecedor.</div>')+'</div>'}
function newSupplier(){openModal('Novo fornecedor','<div class="form"><div class="field"><label>Nome *</label><input id="fn"></div><div class="field"><label>Telefone</label><input id="fp"></div><div class="field"><label>CNPJ/CPF</label><input id="fd"></div><div class="field"><label>Observações</label><input id="fo"></div></div>',saveSupplier)}
async function saveSupplier(){if(!$('fn').value.trim()){toast('Informe o nome.');return}await addObject('suppliers',{id:id(),name:$('fn').value.trim(),phone:$('fp').value,doc:$('fd').value,obs:$('fo').value});closeModal();toast('Fornecedor salvo na nuvem.');go('fornecedores')}
function relatorios(){const t=sums(),map={};db.sales.forEach(s=>s.items.forEach(i=>map[i.name]=(map[i.name]||0)+Number(i.qty||0)));const best=Object.entries(map).sort((a,b)=>b[1]-a[1]).slice(0,7),stockCost=db.products.reduce((a,p)=>a+Number(p.cost||0)*Number(p.stock||0),0),stockSale=db.products.reduce((a,p)=>a+Number(p.price||0)*Number(p.stock||0),0);return '<div class="cards"><div class="card"><div class="eyebrow">Faturamento</div><div class="big">'+brl(t.r)+'</div></div><div class="card"><div class="eyebrow">Lucro bruto</div><div class="big green">'+brl(t.p)+'</div></div><div class="card"><div class="eyebrow">Margem</div><div class="big">'+(t.r?(t.p/t.r*100).toFixed(1):0)+'%</div></div><div class="card"><div class="eyebrow">Vendas</div><div class="big">'+db.sales.length+'</div></div></div><div class="layout"><div class="panel"><h3>Produtos mais vendidos</h3>'+(best.length?best.map((x,i)=>'<div class="progressRow"><span>'+(i+1)+'. '+esc(x[0])+'</span><div class="progress"><i style="width:'+(x[1]/best[0][1]*100)+'%"></i></div><b>'+x[1]+'</b></div>').join(''):'<div class="empty">Ainda sem vendas.</div>')+'</div><div class="panel"><h3>Valor do estoque</h3><div class="big">'+brl(stockCost)+'</div><div class="muted">a custo</div><hr style="border:0;border-top:1px solid var(--line);margin:18px 0"><div class="big">'+brl(stockSale)+'</div><div class="muted">potencial de venda</div></div></div>'}
function config(){return '<div class="panel"><h3>Dados da Telle</h3><p class="muted">Usados no comprovante e nas cobranças.</p><div class="form" style="margin-top:15px"><div class="field"><label>Chave PIX</label><input id="pix" value="'+esc(db.settings.pix)+'"></div><div class="field"><label>Instagram</label><input id="insta" value="'+esc(db.settings.instagram)+'"></div></div><div class="toolbar" style="margin-top:15px"><button class="primary" id="saveConfig" type="button">Salvar</button><button class="danger" onclick="resetData()" type="button">Apagar dados locais</button></div><div class="notice" style="margin-top:15px">☁️ <b>Banco conectado:</b> seus dados desta conta são carregados do Firebase Firestore.</div></div>'}
function wire(p){
 if(p==='vendas'){$('saleNew').onclick=newSaleFn;$('saleSearch').oninput=e=>{const q=e.target.value.toLowerCase();$('salePanel').innerHTML=salesTable(db.sales.slice().reverse().filter(s=>(s.client||'').toLowerCase().includes(q)||s.items.some(i=>String(i.name).toLowerCase().includes(q))))}}
 if(p==='clientes'){$('newClient').onclick=newClient;$('clientSearch').oninput=e=>{const q=e.target.value.toLowerCase();$('clientPanel').innerHTML=clientTable(db.clients.filter(c=>(c.name+' '+(c.phone||'')).toLowerCase().includes(q)))}}
 if(p==='estoque'){$('newProduct').onclick=newProduct;$('productSearch').oninput=e=>{const q=e.target.value.toLowerCase();$('productPanel').innerHTML=productTable(db.products.filter(x=>(x.name+' '+(x.brand||'')+' '+(x.category||'')+' '+(x.sku||'')).toLowerCase().includes(q)))}}
 if(p==='financeiro')$('expense').onclick=expense;
 if(p==='fornecedores')$('newSupplier').onclick=newSupplier;
 if(p==='config')$('saveConfig').onclick=async()=>{db.settings.pix=$('pix').value;db.settings.instagram=$('insta').value;saveLocal();await cloudPut('settings',{id:'main',...db.settings});toast('Configurações salvas na nuvem.')};
}
function backup(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='telle-v4-backup.json';a.click();toast('Backup baixado.')}
function restoreFile(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=async()=>{try{const x=JSON.parse(r.result);if(!x.products||!x.sales)throw new Error('invalid');for(const name of ['products','clients','sales','receivables','cash','suppliers'])for(const obj of x[name]||[])await cloudPut(name,obj);if(x.settings)await cloudPut('settings',{id:'main',...x.settings});db=await cloudLoad();saveLocal();toast('Backup restaurado na nuvem.');go('dashboard')}catch(e){console.error(e);toast('Backup inválido ou erro ao restaurar.')}};r.readAsText(f)}
function resetData(){if(confirm('Isso apaga somente o backup local deste aparelho. Os dados da nuvem não serão apagados. Continuar?')){localStorage.removeItem(LOCAL_KEY);toast('Dados locais apagados.')}}
backupEl.onclick=backup;restoreEl.onchange=restoreFile;
window.go=go;window.charge=charge;window.details=details;window.receipt=receipt;window.historyClient=historyClient;window.move=move;window.resetData=resetData;
window.addEventListener('error',e=>console.error('Telle error:',e.error||e.message));window.addEventListener('unhandledrejection',e=>console.error('Telle rejection:',e.reason));

(async function boot(){
 try{
  if(await ensureAuth()){
   showApp();go('dashboard');toast('Telle conectada à nuvem ☁️');
   try{db=await cloudLoad();saveLocal();go('dashboard')}catch(e){console.error('Firestore boot:',e);toast('Sistema aberto. A nuvem está indisponível agora.');}
  }else showLogin('');
 }catch(e){console.error('Boot:',e);clearAuth();showLogin('');}
})();
})();
</script>

</body></html>
