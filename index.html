<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">

<style>
:root{--p:#a51d55;--p2:#cf3b79;--bg:#faf7f9;--ink:#321724;--muted:#8b737d;--line:#eadde4;--soft:#fff0f6;--ok:#087a58;--bad:#c0264e}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,select,textarea{font:inherit}button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}input,select,textarea{font-size:16px}
#login{height:100%;display:grid;place-items:center;padding:18px;background:linear-gradient(160deg,#fff,#fff3f8 70%,#efd5e1)}
.login{width:min(400px,100%);padding:24px 20px;background:#fff;border:1px solid var(--line);border-radius:27px;box-shadow:0 25px 70px #4b102318}.logo{height:100px;display:grid;place-items:center}.logo img{max-width:255px;max-height:100px;object-fit:contain}.login h1{text-align:center;font-size:21px;margin:6px}.login p{text-align:center;color:var(--muted);font-size:11px}.field{margin:9px 0}.field label{display:block;color:var(--muted);font-size:10px}.field input,.field select,.field textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;outline:0;margin-top:5px}.enter{width:100%;border:0;border-radius:13px;padding:14px;background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;font-weight:800}.msg{text-align:center;color:var(--bad);font-size:10px;min-height:18px;margin-top:8px}
.app{height:100%;display:flex;flex-direction:column}.top{height:72px;min-height:72px;padding:calc(8px + env(safe-area-inset-top)) 14px 8px;background:#fffffff7;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:9px}.brand img{width:40px;height:40px;object-fit:contain;border-radius:10px}.brand b{display:block;font-size:16px}.brand small{display:block;font-size:9px;color:var(--muted)}.plus{width:42px;height:42px;border:0;border-radius:13px;background:var(--p);color:#fff;font-size:23px}
.view{flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;padding:13px 13px calc(88px + env(safe-area-inset-bottom))}.page{max-width:760px;margin:auto}
.nav{height:76px;min-height:76px;display:grid;grid-template-columns:repeat(5,1fr);background:#fffffff7;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}.nav button{border:0;background:transparent;color:var(--muted);font-size:9px}.nav span{display:block;font-size:20px;line-height:26px}.nav .active{color:var(--p);font-weight:800}
.hero{display:flex;justify-content:space-between;align-items:center;padding:17px;background:linear-gradient(135deg,#fff,#fff0f6);border:1px solid var(--line);border-radius:21px}.hero small{font-size:10px;color:var(--muted)}.hero h1{font-size:20px;margin:3px 0}.hero p{font-size:10px;color:var(--muted);margin:0}.hero span{font-size:30px}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}.metric{background:#fff;border:1px solid var(--line);border-radius:15px;padding:11px}.metric small{display:block;color:var(--muted);font-size:9px}.metric b{display:block;font-size:15px;margin:5px 0}.metric i{font-style:normal;color:var(--muted);font-size:8px}.ok{color:var(--ok)!important}.bad{color:var(--bad)!important}
.big{width:100%;border:0;border-radius:17px;background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;padding:13px;display:flex;align-items:center;gap:11px;text-align:left;margin:2px 0 17px}.big span{font-size:25px}.big div{flex:1}.big b{display:block;font-size:13px}.big small{font-size:9px;opacity:.82}.big i{font-size:24px;font-style:normal}.title{display:flex;justify-content:space-between;align-items:center;margin:13px 2px 7px}.title b{font-size:13px}.link{border:0;background:none;color:var(--p);font-size:10px;font-weight:800}.list{display:grid;gap:7px}.item{width:100%;min-height:63px;background:#fff;border:1px solid var(--line);border-radius:15px;padding:9px;display:flex;align-items:center;gap:9px;text-align:left;color:var(--ink)}.ico{width:39px;height:39px;border-radius:12px;background:var(--soft);display:grid;place-items:center;font-size:19px}.main{flex:1;min-width:0}.main b{display:block;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.main small{display:block;color:var(--muted);font-size:9px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.right{text-align:right}.right b{display:block;font-size:11px}.right small{font-size:8px}.item>i{font-style:normal;color:#b99eaa;font-size:21px}.empty{padding:28px;text-align:center;border:1px dashed var(--line);border-radius:15px;background:#fff;color:var(--muted);font-size:11px}
.toolbar{display:flex;gap:8px;margin-bottom:10px}.search{flex:1;background:#fff;border:1px solid var(--line);border-radius:13px;display:flex;align-items:center;padding:0 10px;color:var(--muted)}.search input{width:100%;border:0;outline:0;background:transparent;padding:11px}.round{width:44px;height:44px;border:0;border-radius:14px;background:var(--p);color:#fff;font-size:22px}.chips{display:flex;gap:6px;overflow:auto;margin-bottom:10px}.chip{border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:99px;padding:8px 12px;font-size:9px}.chip.active{background:var(--soft);color:var(--p);font-weight:800}.more{display:grid;grid-template-columns:1fr 1fr;gap:8px}.more button{min-height:110px;border:1px solid var(--line);background:#fff;border-radius:16px;text-align:left;padding:13px}.more span{display:block;font-size:23px;margin-bottom:10px}.more b{display:block;font-size:12px}.more small{display:block;color:var(--muted);font-size:8px;margin-top:3px}.logout{width:100%;border:0;border-radius:13px;background:#fff0f3;color:var(--bad);padding:13px;font-size:11px;font-weight:800;margin-top:9px}
.modalbg{position:fixed;inset:0;background:#2b0a1b88;display:grid;place-items:end center;padding:9px;z-index:100}.modal{width:min(620px,100%);max-height:93vh;overflow:auto;background:#fff;border-radius:23px;padding:15px}.mh{display:flex;justify-content:space-between;align-items:center}.mh h2{font-size:17px;margin:0}.close{width:35px;height:35px;border:0;border-radius:50%;background:var(--soft);color:var(--p);font-size:20px}.mf{display:flex;justify-content:flex-end;gap:7px;margin-top:11px}.soft,.primary{border:0;border-radius:11px;padding:10px 13px;font-weight:800}.soft{background:var(--soft);color:var(--p)}.primary{background:var(--p);color:#fff}.sale label{display:block;color:var(--muted);font-size:10px;margin:8px 0}.sale input,.sale select{display:block;width:100%;margin-top:5px;border:1px solid var(--line);border-radius:11px;padding:11px;outline:0}.two{display:grid;grid-template-columns:1fr 90px;gap:8px}.info{display:flex;align-items:center;gap:7px;background:var(--soft);padding:10px;border-radius:12px;font-size:10px}.info strong{margin-left:auto}.pix{margin-top:8px;background:var(--soft);border-radius:15px;padding:13px;text-align:center}.pix b,.pix strong{display:block}.pix strong{font-size:20px;margin:4px}.pix canvas,.pix img{background:#fff;padding:7px;border-radius:10px}.pix button{display:block;width:100%;border:0;border-radius:11px;background:#fff;color:var(--p);padding:10px;font-weight:800;margin-top:9px}.pix textarea{width:100%;height:65px;border:1px solid var(--line);border-radius:10px;font-size:9px;margin-top:7px}.warning{margin-top:8px;background:#fff4d8;color:#73580a;padding:10px;border-radius:11px;font-size:10px}
#toast{position:fixed;z-index:200;left:50%;bottom:92px;transform:translate(-50%,15px);opacity:0;background:#321724;color:#fff;padding:10px 13px;border-radius:12px;font-size:10px;transition:.2s}.show{opacity:1!important;transform:translate(-50%,0)!important}
@media(min-width:700px){.metrics{grid-template-columns:repeat(4,1fr)}.more{grid-template-columns:repeat(3,1fr)}.modalbg{place-items:center}}

<body>
<section id="login"><div class="login"><div class="logo"><img src="telle-logo.png" alt="Telle Cosméticos"></div><h1>Telle Cosméticos 🌸</h1><p>Seu aplicativo de vendas</p><div class="field"><label>E-mail</label><input id="email" type="email" autocomplete="username"></div><div class="field"><label>Senha</label><input id="password" type="password" autocomplete="current-password"></div><button id="loginButton" class="enter" type="button">Entrar</button><div id="loginMessage" class="msg"></div></div></section>
<section id="app" hidden></section><div id="modal"></div><div id="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const FIREBASE={apiKey:"AIzaSyADx57Ilk5JCaZFoHOeC3APensUHX6P3C4",projectId:"telle-cosmeticos"};
const $=id=>document.getElementById(id);
const esc=value=>String(value??"").replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[char]));
const money=value=>Number(value||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const today=()=>new Date().toISOString().slice(0,10);
const dateBR=value=>{const p=String(value||"").slice(0,10).split("-");return p.length===3?p.reverse().join("/"):"-"};
const makeId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const blank=()=>({products:[],clients:[],sales:[],receivables:[],cash:[],suppliers:[],settings:{pix:"",pixName:"TELLE COSMETICOS",pixCity:"JOINVILLE"}});
let data=blank();
let idToken=localStorage.getItem("telle_token")||"";
let userId=localStorage.getItem("telle_uid")||"";
let saleFilter="all";

function notify(text){const box=$("toast");box.textContent=text;box.classList.add("show");clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>box.classList.remove("show"),2200)}
function storageKey(){return "telle_data_"+userId}
function loadLocal(){
 try{
  const saved=JSON.parse(localStorage.getItem(storageKey())||"null");
  const base=blank();
  if(saved&&typeof saved==="object"){
   data=Object.assign(base,saved);
   ["products","clients","sales","receivables","cash","suppliers"].forEach(k=>{
    if(!Array.isArray(data[k]))data[k]=[];
   });
   data.settings=Object.assign(base.settings,
    saved.settings&&typeof saved.settings==="object"?saved.settings:{});
  }else data=base;
 }catch(error){
  console.warn("TELLE_LOCAL_DATA_RESET",error);
  data=blank();
 }
}
function saveLocal(){localStorage.setItem(storageKey(),JSON.stringify(data))}
async function signIn(email,password){
 const controller=new AbortController();
 const timeout=setTimeout(()=>controller.abort(),10000);
 try{
  const response=await fetch(
   "https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key="+encodeURIComponent(FIREBASE.apiKey),
   {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({email,password,returnSecureToken:true}),
    signal:controller.signal,
    cache:"no-store"
   }
  );
  const result=await response.json().catch(()=>({}));
  if(!response.ok){
   const code=result?.error?.message||"UNKNOWN_ERROR";
   const messages={
    INVALID_LOGIN_CREDENTIALS:"E-mail ou senha inválidos.",
    EMAIL_NOT_FOUND:"E-mail ou senha inválidos.",
    INVALID_PASSWORD:"E-mail ou senha inválidos.",
    USER_DISABLED:"Esta conta está desativada.",
    TOO_MANY_ATTEMPTS_TRY_LATER:"Muitas tentativas. Aguarde alguns minutos.",
    INVALID_API_KEY:"A configuração do Firebase está inválida."
   };
   throw Error(messages[code]||"Não foi possível entrar agora. Tente novamente.");
  }
  if(!result.idToken||!result.localId)throw Error("O Firebase não retornou uma sessão válida.");
  idToken=result.idToken;
  userId=result.localId;
  localStorage.setItem("telle_token",idToken);
  localStorage.setItem("telle_uid",userId);
 }catch(error){
  if(error.name==="AbortError")throw Error("O Firebase demorou para responder. Verifique a internet e tente novamente.");
  throw error;
 }finally{
  clearTimeout(timeout);
 }
}
function signOut(){localStorage.removeItem("telle_token");localStorage.removeItem("telle_uid");location.reload()}
function totals(){let revenue=0,cost=0,open=0;data.sales.forEach(s=>{revenue+=Number(s.total)||0;cost+=Number(s.cost)||0;open+=Math.max(0,(Number(s.total)||0)-(Number(s.paid)||0))});return{revenue,cost,profit:revenue-cost,open}}

function crc16(text){let crc=0xffff;for(let i=0;i<text.length;i++){crc^=text.charCodeAt(i)<<8;for(let j=0;j<8;j++)crc=(crc&0x8000)?((crc<<1)^0x1021)&0xffff:(crc<<1)&0xffff}return crc.toString(16).toUpperCase().padStart(4,"0")}
function pixCode(key,value,name,city,txid){
 const field=(tag,value)=>tag+String(value).length.toString().padStart(2,"0")+value;
 let payload=field("00","01")+field("26",field("00","br.gov.bcb.pix")+field("01",key))+field("52","0000")+field("53","986")+field("54",Number(value).toFixed(2))+field("58","BR")+field("59",String(name||"TELLE COSMETICOS").slice(0,25))+field("60",String(city||"JOINVILLE").slice(0,15))+field("62",field("05",String(txid||"TELLE").replace(/[^A-Za-z0-9]/g,"").slice(0,25)||"TELLE"));
 return payload+"6304"+crc16(payload+"6304")
}

function showModal(title,content,handler,label="Salvar"){
 $("modal").innerHTML=`<div class="modalbg"><div class="modal"><div class="mh"><h2>${title}</h2><button id="modalClose" class="close" type="button">×</button></div>${content}<div class="mf"><button id="modalCancel" class="soft" type="button">Cancelar</button><button id="modalOk" class="primary" type="button">${label}</button></div></div></div>`;
 $("modalClose").onclick=closeModal;$("modalCancel").onclick=closeModal;$("modalOk").onclick=async()=>{try{await handler()}catch(error){notify(error.message||"Erro")}}
}
function closeModal(){$("modal").innerHTML=""}

function salePix(total){
 const area=$("salePix");if(!area)return;
 if($("payment").value!=="PIX"){area.innerHTML="";return}
 if(!data.settings.pix){area.innerHTML='<div class="warning">💠 Pix selecionado. Cadastre sua chave em Mais → Configurações.</div>';return}
 const code=pixCode(data.settings.pix,total,data.settings.pixName,data.settings.pixCity,"VENDA");
 area.innerHTML=`<div class="pix"><b>💠 Pix</b><strong>${money(total)}</strong><div id="saleQr"></div><button id="copySalePix" type="button">📋 Copiar Pix copia e cola</button><textarea id="salePixText" readonly>${esc(code)}</textarea></div>`;
 if(window.QRCode)new QRCode($("saleQr"),{text:code,width:210,height:210});
 $("copySalePix").onclick=async()=>{try{await navigator.clipboard.writeText(code);notify("Pix copiado!")}catch{const field=$("salePixText");field.select();document.execCommand("copy");notify("Pix copiado!")}}
}
function refreshSale(){
 const product=data.products.find(item=>item.id===$("saleProduct").value);if(!product)return;
 const qty=Math.max(1,Number($("saleQty").value)||1),total=product.price*qty;
 $("saleInfo").innerHTML=`<b>${esc(product.name)}</b><span>${qty} × ${money(product.price)}</span><strong>${money(total)}</strong>`;
 const pix=$("payment").value==="PIX";$("salePaid").readOnly=pix;if(pix)$("salePaid").value="0";salePix(total)
}
function newSale(){
 const products=data.products.filter(p=>p.stock>0);if(!products.length){notify("Cadastre produtos com estoque.");return}
 showModal("Nova venda",`<div class="sale"><label>Cliente<select id="saleClient"><option value="">Venda balcão</option>${data.clients.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join("")}</select></label><div class="two"><label>Produto<select id="saleProduct">${products.map(p=>`<option value="${p.id}">${esc(p.name)} · ${money(p.price)}</option>`).join("")}</select></label><label>Qtd.<input id="saleQty" type="number" min="1" value="1"></label></div><label>Forma de pagamento<select id="payment"><option>PIX</option><option>Dinheiro</option><option>Cartão</option><option>Fiado</option></select></label><label>Pago agora<input id="salePaid" type="number" min="0" step=".01" value="0"></label><label>Vencimento<input id="saleDue" type="date" value="${today()}"></label><div id="saleInfo" class="info"></div><div id="salePix"></div></div>`,saveSale,"Finalizar venda");
 ["saleProduct","saleQty","payment","salePaid"].forEach(id=>$(id).addEventListener("input",refreshSale));$("payment").addEventListener("change",refreshSale);refreshSale()
}
async function saveSale(){
 const product=data.products.find(p=>p.id===$("saleProduct").value),qty=Math.max(1,Number($("saleQty").value)||1),total=product.price*qty;
 if(qty>product.stock)throw Error("Estoque insuficiente.");
 const client=data.clients.find(c=>c.id===$("saleClient").value),method=$("payment").value;
 let paid=Math.max(0,Math.min(total,Number($("salePaid").value)||0));if(method!=="Fiado"&&paid===0)paid=total;
 const sale={id:makeId(),clientId:client?.id||"",client:client?.name||"Venda balcão",items:[{productId:product.id,name:product.name,qty,price:product.price}],total,cost:(product.cost||0)*qty,paid,payment:method,created:new Date().toISOString(),due:$("saleDue").value};
 product.stock-=qty;data.sales.push(sale);
 if(total>paid)data.receivables.push({id:makeId(),saleId:sale.id,client:sale.client,amount:total-paid,due:sale.due,status:"open"});
 if(paid)data.cash.push({id:makeId(),saleId:sale.id,type:"in",value:paid,date:today(),method});
 saveLocal();closeModal();go("sales");notify("Venda registrada.")
}
async function addProduct(){showModal("Novo produto",`<div class="sale"><label>Nome<input id="productName"></label><div class="two"><label>Preço<input id="productPrice" type="number" step=".01"></label><label>Estoque<input id="productStock" type="number" value="0"></label></div><label>Custo<input id="productCost" type="number" step=".01" value="0"></label><label>Estoque mínimo<input id="productMin" type="number" value="2"></label></div>`,async()=>{const p={id:makeId(),name:$("productName").value.trim(),price:Number($("productPrice").value),cost:Number($("productCost").value),stock:Number($("productStock").value),min:Number($("productMin").value)||2};if(!p.name||!p.price)throw Error("Informe nome e preço.");data.products.push(p);saveLocal();closeModal();go("stock");notify("Produto cadastrado.")},"Cadastrar")}
async function addClient(){showModal("Novo cliente",`<div class="sale"><label>Nome<input id="clientName"></label><label>WhatsApp<input id="clientPhone" inputmode="tel"></label></div>`,async()=>{const c={id:makeId(),name:$("clientName").value.trim(),phone:$("clientPhone").value.trim()};if(!c.name)throw Error("Informe o nome.");data.clients.push(c);saveLocal();closeModal();go("clients");notify("Cliente cadastrado.")},"Cadastrar")}
async function addSupplier(){showModal("Novo fornecedor",`<div class="sale"><label>Nome<input id="supplierName"></label><label>Telefone<input id="supplierPhone"></label></div>`,async()=>{const s={id:makeId(),name:$("supplierName").value.trim(),phone:$("supplierPhone").value.trim()};if(!s.name)throw Error("Informe o nome.");data.suppliers.push(s);saveLocal();closeModal();openMore("suppliers");notify("Fornecedor cadastrado.")},"Cadastrar")}
async function registerPayment(saleId){
 const sale=data.sales.find(s=>s.id===saleId);if(!sale)return;
 const open=Math.max(0,sale.total-sale.paid);if(!open){notify("Venda já paga.");return}
 showModal("Registrar pagamento",`<div class="sale"><div class="info"><b>${esc(sale.client)}</b><strong>${money(open)}</strong></div><label>Valor recebido<input id="paymentValue" type="number" min=".01" max="${open}" step=".01" value="${open}"></label><label>Forma<select id="paymentMethod"><option>PIX</option><option>Dinheiro</option><option>Cartão</option></select></label></div>`,async()=>{const value=Math.min(open,Math.max(0,Number($("paymentValue").value)||0));if(!value)throw Error("Informe o valor.");sale.paid+=value;const receivable=data.receivables.find(r=>r.saleId===sale.id&&r.status!=="paid");if(receivable){receivable.amount=Math.max(0,receivable.amount-value);if(receivable.amount<=0)receivable.status="paid"}data.cash.push({id:makeId(),saleId:sale.id,type:"in",value,date:today(),method:$("paymentMethod").value});saveLocal();closeModal();go("sales");notify("Pagamento registrado.")},"Receber")
}
function saleDetails(saleId){
 const sale=data.sales.find(s=>s.id===saleId);if(!sale)return;const open=Math.max(0,sale.total-sale.paid);
 showModal("Pedido #"+sale.id.slice(-6),`<div class="panel"><div class="title"><b>${esc(sale.client)}</b><span>${dateBR(sale.created)}</span></div>${sale.items.map(i=>`<div class="title"><span>${esc(i.name)} × ${i.qty}</span><b>${money(i.price*i.qty)}</b></div>`).join("")}<div class="title"><span>Total</span><b>${money(sale.total)}</b></div><div class="title"><span>Pago</span><b class="ok">${money(sale.paid)}</b></div><div class="title"><span>Pendente</span><b class="bad">${money(open)}</b></div></div>`,async()=>closeModal(),"Fechar");
 if(open){$("modalOk").style.display="none";const payButton=document.createElement("button");payButton.className="primary";payButton.textContent="💰 Registrar pagamento";payButton.onclick=()=>{closeModal();registerPayment(sale.id)};$("modal").querySelector(".mf").prepend(payButton);if(data.settings.pix){const pixButton=document.createElement("button");pixButton.className="soft";pixButton.textContent="💠 Pix";pixButton.onclick=()=>{closeModal();salePixModal(sale.id)};$("modal").querySelector(".mf").prepend(pixButton)}}
}
function salePixModal(saleId){
 const sale=data.sales.find(s=>s.id===saleId),value=Math.max(0,sale.total-sale.paid);if(!data.settings.pix){notify("Cadastre sua chave Pix.");return}
 const code=pixCode(data.settings.pix,value,data.settings.pixName,data.settings.pixCity,sale.id.slice(-10));
 showModal("Pix da venda",`<div class="pix"><b>💠 Valor a pagar</b><strong>${money(value)}</strong><div id="detailQr"></div><button id="copyDetailPix" type="button">📋 Copiar Pix copia e cola</button><textarea id="detailPixText" readonly>${esc(code)}</textarea></div>`,async()=>closeModal(),"Fechar");
 if(window.QRCode)new QRCode($("detailQr"),{text:code,width:230,height:230});
 $("copyDetailPix").onclick=async()=>{try{await navigator.clipboard.writeText(code);notify("Pix copiado!")}catch{const field=$("detailPixText");field.select();document.execCommand("copy");notify("Pix copiado!")}}
}
function charge(saleId){
 const sale=data.sales.find(s=>s.id===saleId);if(!sale)return;
 const pending=Math.max(0,sale.total-sale.paid),client=data.clients.find(c=>c.id===sale.clientId),phone=(client?.phone||"").replace(/\D/g,"");
 const text=`🌸 *TELLE COSMÉTICOS*

Olá, ${sale.client}! Tudo bem? 💕

Passando para lembrar do valor em aberto da sua compra.

🧾 Pedido: #${sale.id.slice(-6)}
💰 Valor pendente: *${money(pending)}*
📅 Vencimento: ${dateBR(sale.due)}

Assim que realizar o pagamento, pode me enviar o comprovante por aqui.

Obrigada pela preferência! 🌷
*Telle Cosméticos*`;
 window.open("https://wa.me/"+phone+"?text="+encodeURIComponent(text),"_blank")
}
function stockEdit(productId){const p=data.products.find(x=>x.id===productId);showModal("Ajustar estoque",`<div class="sale"><div class="info"><b>${esc(p.name)}</b><strong>${p.stock} un.</strong></div><label>Novo estoque<input id="newStock" type="number" min="0" value="${p.stock}"></label></div>`,async()=>{p.stock=Math.max(0,Number($("newStock").value)||0);saveLocal();closeModal();go("stock");notify("Estoque atualizado.")})}
function clientHistory(clientId){const c=data.clients.find(x=>x.id===clientId),sales=data.sales.filter(s=>s.clientId===clientId);showModal("Histórico • "+esc(c.name),sales.map(s=>`<div class="title"><span>#${s.id.slice(-6)} · ${dateBR(s.created)}</span><b>${money(s.total)}</b></div>`).join("")||'<div class="empty">Nenhuma compra.</div>',async()=>closeModal(),"Fechar")}

function saleRows(list){return list.length?list.map(s=>`<button class="item" data-action="sale" data-id="${s.id}" type="button"><span class="ico">🧾</span><span class="main"><b>${esc(s.client)}</b><small>#${s.id.slice(-6)} · ${dateBR(s.created)}</small></span><span class="right"><b>${money(s.total)}</b><small class="${s.total>s.paid?"bad":"ok"}">${s.total>s.paid?"Pendente":"Pago ✓"}</small></span><i>›</i></button>`).join(""):'<div class="empty">Nenhuma venda.</div>'}
function productRows(list){return list.length?list.map(p=>`<button class="item" data-action="stock" data-id="${p.id}" type="button"><span class="ico">📦</span><span class="main"><b>${esc(p.name)}</b><small>${money(p.price)} · mínimo ${p.min}</small></span><span class="right"><b class="${p.stock<=p.min?"bad":""}">${p.stock}</b><small>un.</small></span><i>›</i></button>`).join(""):'<div class="empty">Nenhum produto.</div>'}
function clientRows(list){return list.length?list.map(c=>`<button class="item" data-action="client" data-id="${c.id}" type="button"><span class="ico">👤</span><span class="main"><b>${esc(c.name)}</b><small>${esc(c.phone||"WhatsApp não cadastrado")}</small></span><i>›</i></button>`).join(""):'<div class="empty">Nenhum cliente.</div>'}
function receivableRows(){const list=data.receivables.filter(r=>r.status!=="paid");return list.length?list.map(r=>`<button class="item" data-action="pay" data-id="${r.saleId}" type="button"><span class="ico">💰</span><span class="main"><b>${esc(r.client)}</b><small>Vencimento ${dateBR(r.due)}</small></span><span class="right"><b class="bad">${money(r.amount)}</b><small class="bad">Receber</small></span><i>›</i></button>`).join(""):'<div class="empty">Nenhuma pendência. 🎉</div>'}

function layout(){return`<div class="app"><header class="top"><div class="brand"><img src="telle-logo.png"><div><b id="pageTitle">Início</b><small id="pageSub">Resumo da sua loja</small></div></div><button id="topPlus" class="plus" type="button">＋</button></header><main id="view" class="view"></main><nav class="nav"><button data-tab="home" type="button"><span>⌂</span><small>Início</small></button><button data-tab="sales" type="button"><span>🛍</span><small>Vendas</small></button><button data-tab="stock" type="button"><span>📦</span><small>Estoque</small></button><button data-tab="clients" type="button"><span>👥</span><small>Clientes</small></button><button data-tab="more" type="button"><span>☰</span><small>Mais</small></button></nav></div>`}
const META={home:["Início","Resumo da sua loja"],sales:["Vendas","Pedidos e pagamentos"],stock:["Estoque","Produtos e quantidade"],clients:["Clientes","Cadastro e histórico"],more:["Mais","Financeiro e configurações"]};
function renderHome(){const t=totals(),recent=data.sales.slice().reverse().slice(0,4);return`<div class="page"><section class="hero"><div><small>Olá! 🌸</small><h1>Telle Cosméticos</h1><p>Seu negócio em um só lugar.</p></div><span>☁️</span></section><div class="metrics"><div class="metric"><small>Faturamento</small><b>${money(t.revenue)}</b><i>${data.sales.length} venda(s)</i></div><div class="metric"><small>A receber</small><b class="bad">${money(t.open)}</b><i>${data.receivables.filter(r=>r.status!=="paid").length} pendência(s)</i></div><div class="metric"><small>Estoque baixo</small><b>${data.products.filter(p=>p.stock<=p.min).length}</b><i>itens para repor</i></div><div class="metric"><small>Lucro</small><b class="ok">${money(t.profit)}</b><i>resultado bruto</i></div></div><button id="homeSale" class="big" type="button"><span>＋</span><div><b>Nova venda</b><small>Pedido, pagamento e Pix</small></div><i>›</i></button><div class="title"><b>Últimas vendas</b><button class="link" data-tab="sales" type="button">Ver todas</button></div><div class="list">${saleRows(recent)}</div></div>`}
function renderSales(){return`<div class="page"><div class="toolbar"><label class="search">🔎<input id="saleSearch" placeholder="Buscar venda ou cliente"></label><button id="salePlus" class="round" type="button">＋</button></div><div class="chips"><button class="chip active" data-filter="all" type="button">Todas</button><button class="chip" data-filter="open" type="button">Pendentes</button><button class="chip" data-filter="paid" type="button">Pagas</button></div><div id="saleList" class="list">${saleRows(data.sales.slice().reverse())}</div></div>`}
function renderStock(){return`<div class="page"><div class="toolbar"><label class="search">🔎<input id="stockSearch" placeholder="Buscar produto"></label><button id="stockPlus" class="round" type="button">＋</button></div><div id="productList" class="list">${productRows(data.products)}</div></div>`}
function renderClients(){return`<div class="page"><div class="toolbar"><label class="search">🔎<input id="clientSearch" placeholder="Buscar cliente"></label><button id="clientPlus" class="round" type="button">＋</button></div><div id="clientList" class="list">${clientRows(data.clients)}</div></div>`}
function renderMore(){return`<div class="page"><div class="more"><button data-more="finance" type="button"><span>💰</span><b>Financeiro</b><small>Caixa e recebimentos</small></button><button data-more="charges" type="button"><span>💬</span><b>Cobranças</b><small>WhatsApp</small></button><button data-more="reports" type="button"><span>📊</span><b>Relatórios</b><small>Resultados</small></button><button data-more="suppliers" type="button"><span>🚚</span><b>Fornecedores</b><small>Cadastros</small></button><button data-more="config" type="button"><span>⚙️</span><b>Configurações</b><small>Pix</small></button><button id="backup" type="button"><span>💾</span><b>Backup</b><small>Salvar dados</small></button></div><button id="logout" class="logout" type="button">Sair da conta</button></div>`}

function go(tab){
 $("pageTitle").textContent=META[tab][0];$("pageSub").textContent=META[tab][1];
 document.querySelectorAll(".nav [data-tab]").forEach(b=>b.classList.toggle("active",b.dataset.tab===tab));
 $("view").innerHTML={home:renderHome,sales:renderSales,stock:renderStock,clients:renderClients,more:renderMore}[tab]();
 bindPage(tab)
}
function bindPage(tab){
 $("topPlus").onclick=newSale;
 $("view").onclick=e=>{
  const tabButton=e.target.closest("[data-tab]");if(tabButton){go(tabButton.dataset.tab);return}
  const action=e.target.closest("[data-action]");
  if(action){if(action.dataset.action==="sale")saleDetails(action.dataset.id);if(action.dataset.action==="pay")registerPayment(action.dataset.id);if(action.dataset.action==="stock")stockEdit(action.dataset.id);if(action.dataset.action==="client")clientHistory(action.dataset.id)}
  const more=e.target.closest("[data-more]");if(more)openMore(more.dataset.more)
 };
 if(tab==="home")$("homeSale").onclick=newSale;
 if(tab==="sales"){
  $("salePlus").onclick=newSale;
  const filter=()=>{let list=data.sales.slice().reverse(),q=$("saleSearch").value.toLowerCase();list=list.filter(s=>(s.client||"").toLowerCase().includes(q));if(saleFilter==="open")list=list.filter(s=>s.total>s.paid);if(saleFilter==="paid")list=list.filter(s=>s.total<=s.paid);$("saleList").innerHTML=saleRows(list)};
  $("saleSearch").oninput=filter;document.querySelectorAll("[data-filter]").forEach(b=>b.onclick=()=>{saleFilter=b.dataset.filter;document.querySelectorAll("[data-filter]").forEach(x=>x.classList.remove("active"));b.classList.add("active");filter()})
 }
 if(tab==="stock"){$("stockPlus").onclick=addProduct;$("stockSearch").oninput=e=>$("productList").innerHTML=productRows(data.products.filter(p=>p.name.toLowerCase().includes(e.target.value.toLowerCase())))}
 if(tab==="clients"){$("clientPlus").onclick=addClient;$("clientSearch").oninput=e=>$("clientList").innerHTML=clientRows(data.clients.filter(c=>c.name.toLowerCase().includes(e.target.value.toLowerCase())))}
 if(tab==="more"){$("backup").onclick=downloadBackup;$("logout").onclick=signOut}
}
function downloadBackup(){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:"application/json"}));a.download="telle-backup.json";a.click();notify("Backup criado.")}
function openMore(kind){
 const names={finance:["Financeiro","Caixa e recebimentos"],charges:["Cobranças","Valores em aberto"],reports:["Relatórios","Resultados"],suppliers:["Fornecedores","Cadastros"],config:["Configurações","Pix"]};
 $("pageTitle").textContent=names[kind][0];$("pageSub").textContent=names[kind][1];
 let body="";
 if(kind==="finance"){const t=totals(),inflow=data.cash.filter(x=>x.type==="in").reduce((a,x)=>a+x.value,0);body=`<div class="metrics"><div class="metric"><small>Entradas</small><b class="ok">${money(inflow)}</b></div><div class="metric"><small>Saldo</small><b>${money(inflow)}</b></div><div class="metric"><small>A receber</small><b class="bad">${money(t.open)}</b></div><div class="metric"><small>Vendas</small><b>${data.sales.length}</b></div></div><div class="list">${receivableRows()}</div>`}
 if(kind==="charges")body=`<div class="list">${data.receivables.filter(r=>r.status!=="paid").map(r=>`<div class="item"><span class="ico">💬</span><span class="main"><b>${esc(r.client)}</b><small>${money(r.amount)} · ${dateBR(r.due)}</small></span><button class="soft" data-charge="${r.saleId}" type="button">Cobrar</button></div>`).join("")||'<div class="empty">Nenhuma pendência.</div>'}</div>`;
 if(kind==="reports"){const t=totals();body=`<div class="metrics"><div class="metric"><small>Faturamento</small><b>${money(t.revenue)}</b></div><div class="metric"><small>Lucro</small><b class="ok">${money(t.profit)}</b></div><div class="metric"><small>Margem</small><b>${t.revenue?(t.profit/t.revenue*100).toFixed(1):0}%</b></div><div class="metric"><small>Produtos</small><b>${data.products.length}</b></div></div>`}
 if(kind==="suppliers")body=`<div class="title"><b>Fornecedores</b><button id="supplierPlus" class="round" type="button">＋</button></div><div class="list">${data.suppliers.map(s=>`<div class="item"><span class="ico">🚚</span><span class="main"><b>${esc(s.name)}</b><small>${esc(s.phone||"")}</small></span></div>`).join("")||'<div class="empty">Nenhum fornecedor.</div>'}</div>`;
 if(kind==="config")body=`<div class="field"><label>Chave Pix</label><input id="pixKey" value="${esc(data.settings.pix)}"></div><div class="field"><label>Nome do recebedor</label><input id="pixName" value="${esc(data.settings.pixName)}"></div><div class="field"><label>Cidade</label><input id="pixCity" value="${esc(data.settings.pixCity)}"></div><button id="savePix" class="enter" type="button">Salvar chave Pix</button>`;
 $("view").innerHTML=`<div class="page"><button id="back" class="link" type="button">‹ Voltar</button>${body}</div>`;$("back").onclick=()=>go("more");
 if(kind==="charges")document.querySelectorAll("[data-charge]").forEach(b=>b.onclick=()=>charge(b.dataset.charge));
 if(kind==="suppliers")$("supplierPlus").onclick=addSupplier;
 if(kind==="config")$("savePix").onclick=()=>{data.settings.pix=$("pixKey").value.trim();data.settings.pixName=$("pixName").value.trim()||"TELLE COSMETICOS";data.settings.pixCity=$("pixCity").value.trim()||"JOINVILLE";saveLocal();notify("Pix salvo.")};
}
function startApp(){
 const login=document.getElementById("login");
 const app=document.getElementById("app");

 login.hidden=true;
 login.style.display="none";
 app.hidden=false;
 app.style.display="block";

 try{
  loadLocal();
  app.innerHTML=layout();
  // Guaranteed mobile navigation for V4.2.4
  if(!document.getElementById("telleMobileNav")){
   const nav=document.createElement("nav");
   nav.id="telleMobileNav";
   nav.style.cssText="position:fixed;left:12px;right:12px;bottom:12px;z-index:99999;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:8px;background:#fff;border:1px solid #f0c9da;border-radius:20px;box-shadow:0 10px 30px rgba(0,0,0,.12);";
   const items=[
    ["🏠","Início","home"],["🛒","Vendas","sales"],["📦","Estoque","products"],["👥","Clientes","clients"]
   ];
   items.forEach(([icon,label,page])=>{
    const b=document.createElement("button");
    b.type="button";
    b.style.cssText="border:0;border-radius:14px;background:#fff4f8;color:#a71958;min-height:58px;font-weight:700;font-size:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;";
    b.innerHTML=`<span style="font-size:20px;line-height:1">${icon}</span><span>${label}</span>`;
    b.onclick=()=>{try{go(page)}catch(e){console.error(e)}};
    nav.appendChild(b);
   });
   document.body.appendChild(nav);
  }
  go("home");
  notify("Telle conectada à nuvem ☁️");
  return true;
 }catch(error){
  console.error("TELLE_DASHBOARD_ERROR",error);
  app.innerHTML=`<div class="app"><header class="top"><div class="brand"><img src="telle-logo.png"><div><b>Início</b><small>Telle Cosméticos</small></div></div></header><main class="view"><div class="page"><section class="hero"><div><small>Olá! 🌸</small><h1>Telle Cosméticos</h1><p>Aplicativo conectado.</p></div><span>☁️</span></section><div class="empty">O aplicativo foi aberto, mas encontrou um erro ao carregar os dados antigos.</div><button id="resetLocalData" class="enter" type="button">Começar com dados limpos</button></div></main></div>`;
  const reset=document.getElementById("resetLocalData");
  if(reset)reset.onclick=()=>{
   localStorage.removeItem(storageKey());
   data=blank();
   app.innerHTML=layout();
   go("home");
   notify("Dados locais recriados.");
  };
  return false;
 }
}
$("loginButton").onclick=async()=>{
 const button=$("loginButton"),message=$("loginMessage");
 const email=$("email").value.trim(),password=$("password").value;
 if(!email||!password){message.textContent="Informe e-mail e senha.";return}
 button.disabled=true;
 button.textContent="Entrando…";
 message.textContent="Conectando ao Firebase…";
 try{
  await signIn(email,password);
  message.textContent="Login confirmado. Abrindo o aplicativo…";
  button.disabled=false;
  button.textContent="Entrar";
  window.requestAnimationFrame(()=>startApp());
 }catch(error){
  console.error("TELLE_LOGIN_ERROR",error);
  message.textContent=error.message||"Não foi possível entrar.";
  button.disabled=false;
  button.textContent="Entrar";
 }
};

$("password").addEventListener("keydown",event=>{if(event.key==="Enter")$("loginButton").click()});
if(idToken&&userId){
 try{startApp()}catch(error){
  localStorage.removeItem("telle_token");
  localStorage.removeItem("telle_uid");
 }
}
</script>
</body>
</html>
